 {t:"Gli articoli indeterminativi",tfa:"حرف تعریف نامعین",html:"<p>حرف نکره برای چیزی که برای شنونده تازه است:</p><ul><li>مذکر پیش از هم‌خوان: <b class='it'>un</b> — un libro</li><li>مذکر پیش از s+هم‌خوان، z، gn، ps: <b class='it'>uno</b> — uno studente, uno zaino</li><li>مؤنث: <b class='it'>una</b> — una penna؛ پیش از واکه <b class='it'>un’</b> — un’amica</li></ul><p>جمع ندارد؛ برای «چند تا» از حرف جزئی استفاده می‌شود: dei libri، delle penne.</p>",

 {t:"Il plurale dei sostantivi",tfa:"جمع اسم‌ها",html:"<p>سه قانون اصلی:</p><ul><li>مذکر <b class='it'>-o</b> → <b class='it'>-i</b>: libro → libri</li><li>مؤنث <b class='it'>-a</b> → <b class='it'>-e</b>: casa → case</li><li>مذکر و مؤنث <b class='it'>-e</b> → <b class='it'>-i</b>: studente → studenti، chiave → chiavi</li></ul><p>اسم‌های مختوم به حرف تأکیددار یا هم‌خوان تغییر نمی‌کنند: la città → le città، il bar → i bar.</p>",

culture:{t:"Caffè culturale 2 — Dare del tu o del Lei?",fa:"فرهنگ: «تو» یا «شما»؟",html:"<p>در ایتالیا مرز رسمی و غیررسمی مهم است. با استاد، پزشک، کارمند اداره و مشتری ناشناس از <b class='it'>Lei</b> استفاده می‌شود. عبارت <b class='it'>Possiamo darci del tu?</b> یعنی «می‌توانیم با هم «تو» بگوییم؟» و پیشنهاد صمیمی‌تر شدن است.</p><p>هنگام معرفی، ایتالیایی‌ها اول نام کوچک را می‌گویند؛ در محیط رسمی نام خانوادگی با عنوان: <span class='it'>il dottor Rossi, la signora Bianchi</span>. عنوان‌های <i>dottore/dottoressa</i> برای هر فارغ‌التحصیل دانشگاهی هم به کار می‌رود، نه فقط پزشک.</p><p>پرسیدن سن و وضعیت تأهل در گفت‌وگوی دوستانه عادی است، اما در محیط کاری بهتر است منتظر بمانی طرف مقابل خودش بگوید.</p>"}

phrases:[
 {w:"Come si scrive? — C-O-M-E, con la doppia?",fa:"چطور نوشته می‌شود؟ — C-O-M-E، با حرف دوتایی؟"},
 {w:"Si scrive con la maiuscola o con la minuscola?",fa:"با حرف بزرگ نوشته می‌شود یا کوچک؟"},
 {w:"Può ripetere lettera per lettera, per favore?",fa:"می‌شود لطفاً حرف‌به‌حرف تکرار کنید؟"},
 {w:"Buongiorno, che cosa desidera?",fa:"روز بخیر، چه میل دارید؟"},
 {w:"Vorrei un caffè, per favore.",fa:"یک قهوه می‌خواهم، لطفاً."},
 {w:"Per me un cappuccino e un cornetto.",fa:"برای من یک کاپوچینو و یک کرواسان."},
 {w:"Prendo un panino e un’acqua naturale.",fa:"یک ساندویچ و یک آب معمولی می‌گیرم."},
 {w:"Che cosa preferisci, carne o pesce?",fa:"چه ترجیح می‌دهی، گوشت یا ماهی؟"},
 {w:"Preferisco il pesce, grazie.",fa:"ماهی را ترجیح می‌دهم، ممنون."},
 {w:"Avete un tavolo per due?",fa:"میز برای دو نفر دارید؟"},
 {w:"Vorrei prenotare un tavolo per stasera alle otto.",fa:"می‌خواهم میزی برای امشب ساعت هشت رزرو کنم."},
 {w:"A che nome? — A nome Karimi.",fa:"به چه نامی؟ — به نام کریمی."},
 {w:"Mi porta il menù, per favore?",fa:"منو را برایم می‌آورید لطفاً؟"},
 {w:"Mi scusi, manca una forchetta.",fa:"ببخشید، یک چنگال کم است."},
 {w:"Mi porta un po’ di pane e dell’acqua?",fa:"کمی نان و مقداری آب برایم می‌آورید؟"},
 {w:"Che cosa mi consiglia?",fa:"چه پیشنهاد می‌کنید؟"},
 {w:"Sono vegetariano / vegetariana.",fa:"من گیاه‌خوار هستم."},
 {w:"C’è carne in questo piatto?",fa:"در این غذا گوشت هست؟"},
 {w:"Basta così, grazie.",fa:"همین کافی است، ممنون."},
 {w:"Il conto, per favore.",fa:"صورت‌حساب، لطفاً."},
 {w:"Quant’è? — Sono dodici euro e cinquanta.",fa:"چقدر می‌شود؟ — دوازده یورو و پنجاه سنت."},
 {w:"Posso pagare con la carta?",fa:"می‌توانم با کارت پرداخت کنم؟"},
 {w:"Buon appetito! — Grazie, altrettanto!",fa:"نوش جان! — ممنون، همچنین شما!"}
],
dialogs:[
 {id:"3-1",t:"Al bar",tfa:"در کافه",set:"صبح، سفارش صبحانه در یک کافهٔ ایتالیایی.",lines:[
  ["A","Buongiorno! Che cosa desidera?","روز بخیر! چه میل دارید؟"],
  ["B","Buongiorno. Vorrei un cappuccino e un cornetto alla crema, per favore.","روز بخیر. یک کاپوچینو و یک کرواسان با کرم می‌خواهم، لطفاً."],
  ["A","Il cappuccino lo vuole caldo o tiepido?","کاپوچینو را داغ می‌خواهید یا ولرم؟"],
  ["B","Caldo, grazie. E anche un bicchiere d’acqua.","داغ، ممنون. و یک لیوان آب هم لطفاً."],
  ["A","Naturale o frizzante?","معمولی یا گازدار؟"],
  ["B","Naturale. Quant’è?","معمولی. چقدر می‌شود؟"],
  ["A","Allora: un cappuccino, un cornetto e un’acqua… sono quattro euro e venti.","پس: یک کاپوچینو، یک کرواسان و یک آب… می‌شود چهار یورو و بیست سنت."],
  ["B","Ecco a lei. Posso pagare con la carta?","بفرمایید. می‌توانم با کارت پرداخت کنم؟"],
  ["A","Certo. Ecco lo scontrino. Buona giornata!","حتماً. این رسید شما. روز خوبی داشته باشید!"],
  ["B","Grazie, arrivederci!","ممنون، خداحافظ!"]
 ]},
 {id:"3-2",t:"Al ristorante",tfa:"در رستوران",set:"شام دو نفره؛ سفارش کامل با پیش‌غذا، غذای اصلی و صورت‌حساب.",lines:[
  ["A","Buonasera, avete prenotato?","عصر بخیر، رزرو کرده‌اید؟"],
  ["B","Sì, un tavolo per due a nome Amini, per le otto.","بله، یک میز برای دو نفر به نام امینی، برای ساعت هشت."],
  ["A","Perfetto, di qua, per favore. Ecco il menù.","عالی، از این طرف لطفاً. این منو."],
  ["B","Grazie. Che cosa mi consiglia come primo?","ممنون. برای غذای اول چه پیشنهاد می‌کنید؟"],
  ["A","Gli spaghetti alle vongole sono ottimi, e anche le lasagne.","اسپاگتی با صدف عالی است، و لازانیا هم همین‌طور."],
  ["B","Io prendo le lasagne. E tu, Sara?","من لازانیا می‌گیرم. و تو سارا؟"],
  ["C","Per me un’insalata mista e il pesce del giorno. Non mangio carne.","برای من یک سالاد مخلوط و ماهی روز. گوشت نمی‌خورم."],
  ["B","Come contorno prendiamo le patate al forno?","برای دورچین سیب‌زمینی تنوری بگیریم؟"],
  ["C","Sì, buona idea. E una bottiglia d’acqua frizzante.","بله، فکر خوبی است. و یک بطری آب گازدار."],
  ["A","Benissimo. Da bere?","بسیار خوب. برای نوشیدن؟"],
  ["B","Un bicchiere di vino rosso per me, e per lei?","یک لیوان شراب قرمز برای من، و برای شما؟"],
  ["C","Solo acqua, grazie… Mi scusi, manca una forchetta.","فقط آب، ممنون… ببخشید، یک چنگال کم است."],
  ["A","Mi dispiace, la porto subito!","متأسفم، فوراً می‌آورم!"],
  ["B","Grazie. … Tutto buonissimo! Il conto, per favore.","ممنون. … همه‌چیز بسیار خوشمزه بود! صورت‌حساب، لطفاً."],
  ["A","Sono trentotto euro e cinquanta. Grazie e buona serata!","می‌شود سی‌وهشت یورو و پنجاه سنت. ممنون و شب خوبی داشته باشید!"]
 ]},
 {id:"3-3",t:"Una prenotazione al telefono",tfa:"یک رزرو تلفنی",set:"رزرو میز با هجی کردن نام خانوادگی.",lines:[
  ["A","Trattoria da Marco, buongiorno!","تراتوریای «دا مارکو»، روز بخیر!"],
  ["B","Buongiorno, vorrei prenotare un tavolo per sabato sera.","روز بخیر، می‌خواهم میزی برای شنبه‌شب رزرو کنم."],
  ["A","Per quante persone?","برای چند نفر؟"],
  ["B","Per quattro persone, alle otto e mezza.","برای چهار نفر، ساعت هشت‌ونیم."],
  ["A","Va bene. A che nome?","بسیار خوب. به چه نامی؟"],
  ["B","A nome Rezaei.","به نام رضایی."],
  ["A","Come si scrive?","چطور نوشته می‌شود؟"],
  ["B","Erre, e, zeta, a, e, i.","R, e, z, a, e, i."],
  ["A","Perfetto: sabato, ore venti e trenta, quattro persone, Rezaei. Il numero di telefono?","عالی: شنبه، ساعت بیست‌وسی، چهار نفر، رضایی. شماره تلفن؟"],
  ["B","Tre-tre-nove, sessanta, quarantadue, undici.","۳۳۹، ۶۰، ۴۲، ۱۱."],
  ["A","Grazie mille. A sabato!","خیلی ممنون. تا شنبه!"],
  ["B","Grazie a lei, arrivederci.","من از شما ممنونم، خداحافظ."]
 ]}
],
grammar:[
 {t:"Gli interrogativi che, chi, dove, quanti",tfa:"پرسش‌واژه‌های che، chi، dove، quanti",html:"<p>پنج پرسش‌واژهٔ پرکاربرد:</p><ul><li><b class='it'>che</b> + اسم = چه ...ی: <span class='it'>Che cosa prendi?</span></li><li><b class='it'>chi</b> = چه کسی: <span class='it'>Chi è quel signore?</span></li><li><b class='it'>dove</b> = کجا: <span class='it'>Dove mangi?</span></li><li><b class='it'>da dove</b> = از کجا: <span class='it'>Da dove vieni?</span></li><li><b class='it'>quanti / quante</b> = چند تا: <span class='it'>Quanti caffè?</span></li></ul>",
  table:{head:["پرسش‌واژه","معنی","نمونه"],rows:[["che / che cosa","چه","Che cosa ordini?"],["chi","چه کسی","Chi paga?"],["dove","کجا","Dove è il bagno?"],["da dove","از کجا","Da dove arriva?"],["quanti / quante","چند","Quante persone siete?"]]},
  egs:[["Chi è il cameriere?","گارسون کیست؟"],["Dove si paga? — Alla cassa.","کجا باید پول داد؟ — صندوق."],["Quanti panini volete?","چند ساندویچ می‌خواهید؟"]],
  note:"<b class='it'>quanti</b> با اسم مذکر و <b class='it'>quante</b> با اسم مؤنث می‌آید: quanti studenti / quante pizze."},
 {t:"I verbi regolari in -ere",tfa:"فعل‌های باقاعدهٔ -ere",html:"<p>گروه دوم فعل‌ها. مثال: <span class='it'>prend-ere</span>.</p>",
  table:{head:["ضمیر","prendere","leggere","scrivere","vedere"],rows:[["io","prendo","leggo","scrivo","vedo"],["tu","prendi","leggi","scrivi","vedi"],["lui/lei/Lei","prende","legge","scrive","vede"],["noi","prendiamo","leggiamo","scriviamo","vediamo"],["voi","prendete","leggete","scrivete","vedete"],["loro","prendono","leggono","scrivono","vedono"]]},
  egs:[["Prendo un caffè, e tu?","یک قهوه می‌گیرم، و تو؟"],["Che cosa leggi?","چه می‌خوانی؟"],["Loro non mangiano carne.","آن‌ها گوشت نمی‌خورند."]],
  note:"تلفظ: <b class='it'>leggere</b> = «لِج‌جِره»، <b class='it'>prendere</b> = «پرِندره». فعل <b class='it'>bere</b> بی‌قاعده است: bevo, bevi, beve, beviamo, bevete, bevono."},
 {t:"Volere e preferire",tfa:"volere و preferire",html:"<p><b class='it'>volere</b> بی‌قاعده است و <b class='it'>preferire</b> الگوی -isc- می‌گیرد.</p>",
  table:{head:["ضمیر","volere","preferire"],rows:[["io","voglio","preferisco"],["tu","vuoi","preferisci"],["lui/lei/Lei","vuole","preferisce"],["noi","vogliamo","preferiamo"],["voi","volete","preferite"],["loro","vogliono","preferiscono"]]},
  egs:[["Che cosa vuoi bere?","چه می‌خواهی بنوشی؟"],["Preferisco il tè al caffè.","چای را به قهوه ترجیح می‌دهم."],["Vorrei un tavolo per due.","یک میز برای دو نفر می‌خواهم."]],
  note:"برای سفارش مؤدبانه از <b class='it'>vorrei</b> (شرطی volere) استفاده کن، نه «voglio» که دستوری به نظر می‌رسد."},
 {t:"Il plurale dei sostantivi",tfa:"جمع اسم‌ها",html:"<ul><li><b class='it'>-o → -i</b>: libro → libri، panino → panini</li><li><b class='it'>-a → -e</b>: pizza → pizze، forchetta → forchette</li><li><b class='it'>-e → -i</b> (هر دو جنس): ristorante → ristoranti، lezione → lezioni</li><li><b class='it'>-co/-go</b>: معمولاً -chi/-ghi (banco → banchi) اما amico → amici</li><li><b class='it'>-ca/-ga → -che/-ghe</b>: amica → amiche</li><li>واژه‌های با اکسان و واژه‌های بیگانه تغییر نمی‌کنند: caffè → caffè, città → città, bar → bar</li></ul>",
  table:{head:["مفرد","جمع","معنی"],rows:[["il panino","i panini","ساندویچ‌ها"],["la pizza","le pizze","پیتزاها"],["il ristorante","i ristoranti","رستوران‌ها"],["l’arancia","le arance","پرتقال‌ها"],["l’amico","gli amici","دوستان"],["l’amica","le amiche","دوستان (زن)"],["il caffè","i caffè","قهوه‌ها"],["l’uovo","le uova","تخم‌مرغ‌ها"]]}},
 {t:"Gli articoli determinativi",tfa:"حروف تعریف معین",html:"<p>جدول کامل مفرد و جمع:</p>",
  table:{head:["جنس","شروع","مفرد","جمع","مثال"],rows:[["مذکر","هم‌خوان","il","i","il libro → i libri"],["مذکر","s+هم‌خوان, z, gn, ps, y","lo","gli","lo studente → gli studenti"],["مذکر","واکه","l’","gli","l’amico → gli amici"],["مؤنث","هم‌خوان","la","le","la penna → le penne"],["مؤنث","واکه","l’","le","l’arancia → le arance"]]},

 {t:"Le preposizioni in, a, con",tfa:"حروف اضافهٔ in, a, con",html:"<p>ایتالیایی بین «رفتن» و «بودن» تفاوت نمی‌گذارد؛ همان حرف اضافه به کار می‌رود.</p>",

 {t:"I giorni e l’ora",tfa:"روزها و ساعت",html:"<p>روزهای هفته با حرف کوچک نوشته می‌شوند. برای «در روزهای ...» از حرف تعریف استفاده می‌شود: <span class='it'>il lunedì</span> = دوشنبه‌ها. فقط <b class='it'>domenica</b> مؤنث است: <span class='it'>la domenica</span>.</p><p>ساعت: <b class='it'>Che ora è? / Che ore sono?</b> — پاسخ با <b class='it'>è</b> برای یک، ظهر و نیمه‌شب؛ با <b class='it'>sono le</b> برای بقیه.</p>",

phrases:[
 {w:"Mi scusi, mi può dare un’informazione?",fa:"ببخشید، می‌شود اطلاعاتی بدهید؟"},
 {w:"Certo, mi dica.",fa:"حتماً، بفرمایید."},
 {w:"L’albergo è vicino alla stazione?",fa:"هتل نزدیک ایستگاه است؟"},
 {w:"Sa dirmi a che ora apre la reception?",fa:"می‌دانید پذیرش ساعت چند باز می‌شود؟"},
 {w:"Vorrei prenotare una camera, per favore.",fa:"می‌خواهم اتاقی رزرو کنم، لطفاً."},
 {w:"Avete una camera doppia per due notti?",fa:"اتاق دونفره برای دو شب دارید؟"},
 {w:"Per quante persone? — Per due persone.",fa:"برای چند نفر؟ — برای دو نفر."},
 {w:"Dal dieci al tredici giugno.",fa:"از دهم تا سیزدهم ژوئن."},
 {w:"Quanto costa a notte?",fa:"هر شب چقدر است؟"},
 {w:"La colazione è compresa?",fa:"صبحانه شامل قیمت است؟"},
 {w:"C’è il bagno in camera?",fa:"حمام در اتاق هست؟"},
 {w:"C’è l’aria condizionata? — Sì, c’è.",fa:"کولر هست؟ — بله، هست."},
 {w:"Ci sono due letti nella camera?",fa:"در اتاق دو تخت هست؟"},
 {w:"La camera è troppo piccola per noi.",fa:"اتاق برای ما زیادی کوچک است."},
 {w:"Mi dispiace, ma la camera è rumorosa.",fa:"متأسفم، اما اتاق پرسروصدا است."},
 {w:"Il riscaldamento non funziona.",fa:"گرمایش کار نمی‌کند."},
 {w:"Manca l’acqua calda.",fa:"آب گرم نیست."},
 {w:"Può cambiare la camera, per favore?",fa:"می‌توانید اتاق را عوض کنید لطفاً؟"},
 {w:"Posso vedere la camera?",fa:"می‌توانم اتاق را ببینم؟"},
 {w:"Prendo questa, perché è più luminosa.",fa:"این را می‌گیرم، چون روشن‌تر است."},
 {w:"Cerco un appartamento in affitto, arredato.",fa:"دنبال آپارتمان اجاره‌ای مبله می‌گردم."},
 {w:"Quanto sono le spese al mese?",fa:"هزینه‌ها ماهی چقدر است؟"},
 {w:"A che ora è il check-out? — Alle undici.",fa:"تسویه ساعت چند است؟ — ساعت یازده."}
],
dialogs:[
 {id:"5-1",t:"Prenotare una camera",tfa:"رزرو اتاق",set:"تلفنی، رزرو اتاق دونفره با پرسیدن قیمت و خدمات.",lines:[
  ["A","Hotel Bellavista, buongiorno!","هتل بلاویستا، روز بخیر!"],
  ["B","Buongiorno, vorrei prenotare una camera matrimoniale.","روز بخیر، می‌خواهم یک اتاق دونفره رزرو کنم."],
  ["A","Per quando?","برای چه زمانی؟"],
  ["B","Dal dieci al tredici giugno, tre notti.","از دهم تا سیزدهم ژوئن، سه شب."],
  ["A","Un momento, controllo… Sì, abbiamo una camera disponibile.","یک لحظه، بررسی می‌کنم… بله، یک اتاق موجود داریم."],
  ["B","Quanto costa a notte?","هر شب چقدر است؟"],
  ["A","Novanta euro a notte, colazione compresa.","نود یورو برای هر شب، با صبحانه."],
  ["B","C’è il bagno in camera?","حمام در اتاق هست؟"],
  ["A","Certo, con la doccia. E c’è anche l’aria condizionata e il wifi.","حتماً، با دوش. و کولر و وای‌فای هم هست."],
  ["B","Perfetto. C’è un parcheggio?","عالی. پارکینگ هست؟"],
  ["A","Sì, il parcheggio è gratuito per i clienti.","بله، پارکینگ برای مهمانان رایگان است."],
  ["B","Bene, allora prenoto. A che nome? Karimi.","خوب، پس رزرو می‌کنم. به چه نامی؟ کریمی."],
  ["A","Va bene. Può venire dopo le due del pomeriggio. Il check-out è alle undici.","بسیار خوب. می‌توانید بعد از ساعت دو بعدازظهر بیایید. تسویه ساعت یازده است."],
  ["B","Grazie mille. Arrivederci!","خیلی ممنون. خداحافظ!"]
 ]},
 {id:"5-2",t:"Alla reception — un problema",tfa:"در پذیرش — یک مشکل",set:"مهمان از اتاق شکایت می‌کند و راه‌حل می‌گیرد.",lines:[
  ["A","Buonasera, ho la camera numero ventidue.","عصر بخیر، اتاق شمارهٔ بیست‌ودو را دارم."],
  ["B","Buonasera, mi dica.","عصر بخیر، بفرمایید."],
  ["A","Mi dispiace, ma c’è un problema: la camera è molto rumorosa.","متأسفم، اما یک مشکل هست: اتاق خیلی پرسروصدا است."],
  ["B","Mi dispiace tanto. La finestra dà sulla strada.","خیلی متأسفم. پنجره به خیابان باز می‌شود."],
  ["A","E poi il riscaldamento non funziona e non c’è acqua calda.","و بعد گرمایش کار نمی‌کند و آب گرم نیست."],
  ["B","Controllo subito… Ha ragione, mi scusi. Possiamo cambiare camera.","فوراً بررسی می‌کنم… حق با شماست، ببخشید. می‌توانیم اتاق را عوض کنیم."],
  ["A","C’è una camera più tranquilla?","اتاق آرام‌تری هست؟"],
  ["B","Sì, c’è la numero trentacinque, al terzo piano, con vista sul giardino.","بله، شمارهٔ سی‌وپنج هست، طبقهٔ سوم، با چشم‌انداز باغ."],
  ["A","Com’è? È grande come l’altra?","چطور است؟ به‌اندازهٔ آن یکی بزرگ است؟"],
  ["B","È un po’ più grande e molto più luminosa. Costa uguale.","کمی بزرگ‌تر و خیلی روشن‌تر است. قیمتش همان است."],
  ["A","Perfetto, la prendo. Grazie per l’aiuto.","عالی، آن را می‌گیرم. ممنون برای کمک."],
  ["B","Ecco la nuova chiave. Buona serata e ci scusi ancora.","این کلید جدید. شب خوبی داشته باشید و باز هم عذر می‌خواهیم."]
 ]},
 {id:"5-3",t:"Un appartamento in affitto",tfa:"آپارتمان اجاره‌ای",set:"بازدید آپارتمان و انتخاب با دلیل آوردن.",lines:[
  ["A","Allora, questo è l’appartamento: sessanta metri quadri, terzo piano.","خب، این آپارتمان است: شصت متر مربع، طبقهٔ سوم."],
  ["B","Quante stanze ci sono?","چند اتاق دارد؟"],
  ["A","Ci sono un soggiorno, una camera da letto, una cucina e un bagno.","یک نشیمن، یک اتاق خواب، یک آشپزخانه و یک حمام دارد."],
  ["B","È arredato?","مبله است؟"],
  ["A","Sì, è arredato: c’è un divano, un tavolo, due sedie e un letto nuovo.","بله، مبله است: یک کاناپه، یک میز، دو صندلی و یک تخت نو هست."],
  ["B","C’è la lavatrice?","ماشین لباسشویی هست؟"],
  ["A","C’è la lavatrice, ma non c’è la lavastoviglie.","ماشین لباسشویی هست، اما ماشین ظرفشویی نیست."],
  ["B","E il balcone? Mi piace prendere il sole.","و بالکن؟ آفتاب گرفتن را دوست دارم."],
  ["A","C’è un piccolo terrazzo, molto luminoso, con vista sul parco.","یک تراس کوچک هست، خیلی روشن، با چشم‌انداز پارک."],
  ["B","Quanto costa l’affitto?","اجاره چقدر است؟"],
  ["A","Seicento euro al mese, più ottanta euro di spese.","ششصد یورو در ماه، به‌علاوهٔ هشتاد یورو شارژ."],
  ["B","È un po’ caro… ma è centrale e tranquillo. Lo prendo!","کمی گران است… اما مرکزی و آرام است. آن را می‌گیرم!"],
  ["A","Benissimo. Perché non firma qui? Domani può portare i documenti.","بسیار خوب. چرا این‌جا امضا نمی‌کنید؟ فردا می‌توانید مدارک را بیاورید."],
  ["B","Va bene. Grazie mille!","بسیار خوب. خیلی ممنون!"]
 ]}
],
grammar:[
 {t:"I pronomi indiretti singolari",tfa:"ضمایر مفعول غیرمستقیم مفرد",html:"<p>وقتی کسی «گیرنده» است — به او چیزی می‌دهیم، می‌گوییم یا تلفن می‌زنیم — از ضمیر غیرمستقیم استفاده می‌کنیم. شکل ضمیری (atono) پیش از فعل می‌آید:</p><ul><li><b class='it'>mi</b> = به من</li><li><b class='it'>ti</b> = به تو</li><li><b class='it'>gli</b> = به او (مرد)</li><li><b class='it'>le</b> = به او (زن)، و با احترام: به شما</li></ul><p>شکل تأکیدی (tonico): <b class='it'>a me، a te، a lui، a lei</b>. این شکل بعد از فعل یا برای تأکید می‌آید.</p>",
  table:{head:["ضمیر ضمیری","معنی","مثال"],rows:[["mi","به من","Mi dà una camera?"],["ti","به تو","Ti telefono domani."],["gli","به او (مرد)","Gli scrivo un messaggio."],["le","به او (زن) / به شما","Le mando la conferma."],["a me / a te / a lui / a lei","شکل تأکیدی","A lei posso dare la chiave."]]},

culture:{t:"Caffè culturale 5 — Alberghi e affitti in Italia",fa:"فرهنگ: هتل و اجارهٔ خانه در ایتالیا",html:"<p>در ایتالیا هتل‌ها با ستاره درجه‌بندی می‌شوند و قیمت معمولاً <b>برای اتاق و هر شب</b> اعلام می‌شود، نه برای هر نفر. عبارت <b class='it'>colazione inclusa</b> را همیشه چک کن؛ صبحانهٔ ایتالیایی معمولاً شیرین است: کرواسان، مربا و قهوه.</p><p>طبقات از <b class='it'>pianterreno</b> (همکف) شروع می‌شود، پس <span class='it'>il primo piano</span> طبقهٔ بالای همکف است.</p><p>در آگهی‌های اجاره: <b class='it'>monolocale</b> یک‌فضایی، <b class='it'>bilocale</b> یک‌خوابه، <b class='it'>trilocale</b> دوخوابه. کنار اجاره معمولاً <b class='it'>spese condominiali</b> (شارژ) و <b class='it'>utenze</b> (قبوض) جدا حساب می‌شود. برای قرارداد رسمی <span class='it'>codice fiscale</span> و مدرک شناسایی لازم است.</p>"}

phrases:[
 {w:"Mi scusi, sa dov’è il duomo?",fa:"ببخشید، می‌دانید کلیسای جامع کجاست؟"},
 {w:"Scusa, c’è una farmacia qui vicino?",fa:"ببخشید، داروخانه‌ای این نزدیک هست؟"},
 {w:"C’è un bancomat in questa zona?",fa:"در این منطقه خودپرداز هست؟"},
 {w:"Come arrivo alla stazione?",fa:"چطور به ایستگاه برسم؟"},
 {w:"Vada sempre diritto e poi giri a destra.",fa:"مستقیم بروید و بعد به راست بپیچید."},
 {w:"È la seconda strada a sinistra.",fa:"دومین خیابان از سمت چپ است."},
 {w:"È di fronte alla banca, accanto al bar.",fa:"روبه‌روی بانک است، کنار کافه."},
 {w:"È lontano? — No, sono cinque minuti a piedi.",fa:"دور است؟ — نه، پنج دقیقه پیاده است."},
 {w:"Mi dispiace, non sono di qui.",fa:"متأسفم، اهل این‌جا نیستم."},
 {w:"Non lo so, mi spiace. Provi a chiedere al bar.",fa:"نمی‌دانم، متأسفم. امتحان کنید از کافه بپرسید."},
 {w:"Deve chiedere all’ufficio informazioni.",fa:"باید از دفتر اطلاعات بپرسید."},
 {w:"A che ora apre il museo? — Alle nove.",fa:"موزه ساعت چند باز می‌شود؟ — ساعت نه."},
 {w:"A che ora chiudete? — Alle sette e mezza.",fa:"ساعت چند می‌بندید؟ — هفت‌ونیم."},
 {w:"Qual è il giorno di chiusura? — Il lunedì.",fa:"روز تعطیلی کدام است؟ — دوشنبه."},
 {w:"Quanto costa il biglietto? — Otto euro, ridotto cinque.",fa:"بلیت چقدر است؟ — هشت یورو، نیم‌بها پنج."},
 {w:"Ci posso andare a piedi?",fa:"می‌توانم پیاده بروم؟"},
 {w:"Quale autobus devo prendere?",fa:"کدام اتوبوس را باید بگیرم؟"},
 {w:"Peccato! È chiuso.",fa:"حیف شد! بسته است."},
 {w:"Grazie mille, molto gentile!",fa:"خیلی ممنون، بسیار لطف کردید!"}
],
dialogs:[
 {id:"6-1",t:"La seconda a destra",tfa:"دومی از سمت راست",set:"پرسیدن آدرس در خیابان.",lines:[
  ["A","Mi scusi, sa dov’è la farmacia più vicina?","ببخشید، می‌دانید نزدیک‌ترین داروخانه کجاست؟"],
  ["B","Sì, certo. Vada sempre diritto fino al semaforo.","بله، حتماً. تا چراغ راهنما مستقیم بروید."],
  ["A","Fino al semaforo… e poi?","تا چراغ راهنما… و بعد؟"],
  ["B","Poi giri a destra. La farmacia è la seconda a sinistra, di fronte alla banca.","بعد به راست بپیچید. داروخانه دومی از سمت چپ است، روبه‌روی بانک."],
  ["A","È lontano da qui?","از این‌جا دور است؟"],
  ["B","No, sono cinque minuti a piedi, non di più.","نه، پنج دقیقه پیاده است، نه بیشتر."],
  ["A","Sa a che ora chiude?","می‌دانید ساعت چند می‌بندد؟"],
  ["B","Alle sette e mezza, ma il sabato chiude alle sei.","هفت‌ونیم، اما شنبه ساعت شش می‌بندد."],
  ["A","Perfetto. E c’è un bancomat lì vicino?","عالی. و خودپردازی آن نزدیک هست؟"],
  ["B","Sì, c’è un bancomat dentro la banca, accanto alla farmacia.","بله، داخل بانک خودپرداز هست، کنار داروخانه."],
  ["A","Grazie mille, molto gentile!","خیلی ممنون، بسیار لطف کردید!"],
  ["B","Di niente, buona giornata!","قابلی نداشت، روز خوبی داشته باشید!"]
 ]},
 {id:"6-2",t:"All’ufficio informazioni",tfa:"در دفتر اطلاعات گردشگری",set:"برنامه‌ریزی بازدید از یک شهر با ساعت کاری و بلیت.",lines:[
  ["A","Buongiorno! Che cosa posso fare per lei?","روز بخیر! چه کاری می‌توانم برایتان انجام دهم؟"],
  ["B","Buongiorno. Vorrei visitare il centro storico. Che cosa mi consiglia?","روز بخیر. می‌خواهم از بافت تاریخی بازدید کنم. چه پیشنهاد می‌کنید؟"],
  ["A","Allora, deve vedere la piazza principale, il duomo e il museo civico.","خب، باید میدان اصلی، کلیسای جامع و موزهٔ شهر را ببینید."],
  ["B","Il museo è aperto oggi?","موزه امروز باز است؟"],
  ["A","Oggi è lunedì, mi dispiace: il museo è chiuso il lunedì.","امروز دوشنبه است، متأسفم: موزه دوشنبه‌ها بسته است."],
  ["B","Peccato! E domani a che ora apre?","حیف شد! و فردا ساعت چند باز می‌شود؟"],
  ["A","Domani apre alle nove e chiude alle diciotto.","فردا ساعت نه باز می‌شود و هجده می‌بندد."],
  ["B","Quanto costa il biglietto?","بلیت چقدر است؟"],
  ["A","Dieci euro intero, sei euro ridotto per studenti.","ده یورو کامل، شش یورو نیم‌بها برای دانشجویان."],
  ["B","C’è una visita guidata in italiano semplice?","بازدید با راهنما به ایتالیایی ساده هست؟"],
  ["A","Sì, alle undici. Ma deve prenotare.","بله، ساعت یازده. اما باید رزرو کنید."],
  ["B","Va bene. E per arrivare in piazza, quale autobus devo prendere?","بسیار خوب. و برای رسیدن به میدان، کدام اتوبوس را باید بگیرم؟"],
  ["A","Il numero quattro, la fermata è qui davanti. Oppure ci può andare a piedi in venti minuti.","شمارهٔ چهار، ایستگاه همین جلو است. یا می‌توانید بیست دقیقه پیاده بروید."],
  ["B","Preferisco andare a piedi, così vedo la città. Grazie!","ترجیح می‌دهم پیاده بروم، این‌طور شهر را می‌بینم. ممنون!"]
 ]},
 {id:"6-3",t:"Non sono di qui",tfa:"اهل این‌جا نیستم",set:"وقتی کسی آدرس را نمی‌داند؛ عذرخواهی و ارجاع به دیگری.",lines:[
  ["A","Scusi, dov’è l’ufficio postale?","ببخشید، ادارهٔ پست کجاست؟"],
  ["B","Mi dispiace, non sono di qui, non lo so.","متأسفم، اهل این‌جا نیستم، نمی‌دانم."],
  ["A","Non importa, grazie. … Scusa, tu sai dov’è la posta?","مهم نیست، ممنون. … ببخشید، تو می‌دانی پست کجاست؟"],
  ["C","Sì! Devi andare in via Garibaldi, all’angolo con piazza Dante.","بله! باید به خیابان گاریبالدی بروی، نبش میدان دانته."],
  ["A","Devo attraversare il parco?","باید از پارک عبور کنم؟"],
  ["C","No, il parco è dall’altra parte. Vai diritto e prendi la prima a destra.","نه، پارک آن طرف است. مستقیم برو و اولی از راست را بگیر."],
  ["A","A che ora chiude la posta?","پست ساعت چند می‌بندد؟"],
  ["C","Alle due del pomeriggio, quindi devi andare subito!","ساعت دو بعدازظهر، پس باید فوراً بروی!"],
  ["A","Ah, peccato, è tardi! Grazie comunque.","آه، حیف که دیر است! به‌هرحال ممنون."],
  ["C","Figurati! Puoi chiedere anche in tabaccheria, vendono i francobolli.","خواهش می‌کنم! می‌توانی از دخانیات‌فروشی هم بپرسی، تمبر می‌فروشند."]
 ]}
],

culture:{t:"Caffè culturale 6 — Muoversi in Italia",fa:"فرهنگ: گشت‌وگذار در ایتالیا",html:"<p>در شهرهای تاریخی ایتالیا مرکز شهر معمولاً <b class='it'>zona a traffico limitato (ZTL)</b> است: ورود خودرو محدود است و جریمه دارد. بهترین راه، پیاده‌روی یا حمل‌ونقل عمومی است.</p><p>بلیت اتوبوس و مترو را باید <b>پیش از سوار شدن</b> از <span class='it'>tabaccheria</span> یا دستگاه بخری و داخل دستگاه <span class='it'>obliterare</span> (مُهر زمانی زدن) کنی؛ بلیت مُهرنخورده جریمه دارد.</p><p>بسیاری از موزه‌ها <b class='it'>il lunedì</b> بسته‌اند و مغازه‌ها در شهرهای کوچک بین ساعت ۱۳ تا ۱۶ برای <span class='it'>pausa pranzo</span> می‌بندند. یک‌شنبه‌ها هم خیلی از مغازه‌ها تعطیل است. داروخانه‌ها با علامت صلیب سبز مشخص‌اند و همیشه یکی در هر منطقه <span class='it'>farmacia di turno</span> (کشیک) است.</p>"}

phrases:[
 {w:"Come sono andate le vacanze?",fa:"تعطیلات چطور بود؟"},
 {w:"Dove sei andato in vacanza?",fa:"کجا به تعطیلات رفتی؟"},
 {w:"Sono stato al mare due settimane.",fa:"دو هفته در دریا بودم."},
 {w:"Abbiamo visitato Roma e Firenze.",fa:"رم و فلورانس را بازدید کردیم."},
 {w:"Ho fatto il bagno tutti i giorni.",fa:"هر روز آب‌تنی کردم."},
 {w:"Che tempo ha fatto? — Ha fatto bel tempo.",fa:"هوا چطور بود؟ — هوای خوبی بود."},
 {w:"Purtroppo ha piovuto tre giorni.",fa:"متأسفانه سه روز باران آمد."},
 {w:"Ti è piaciuta la vacanza? — Sì, moltissimo!",fa:"تعطیلات را دوست داشتی؟ — بله، خیلی!"},
 {w:"Non ho fatto niente, sono rimasto a casa.",fa:"هیچ کاری نکردم، خانه ماندم."},
 {w:"Non sono mai stato in Italia.",fa:"هرگز در ایتالیا نبوده‌ام."},
 {w:"È stata una vacanza bellissima!",fa:"تعطیلات بسیار زیبایی بود!"},
 {w:"Il posto era bellissimo e la gente gentilissima.",fa:"آن مکان بی‌نهایت زیبا و مردم بی‌نهایت مهربان بودند."},
 {w:"Ho perso il treno, che peccato!",fa:"قطار را از دست دادم، چه حیف!"},
 {w:"Siamo partiti presto e siamo arrivati tardi.",fa:"زود حرکت کردیم و دیر رسیدیم."},
 {w:"L’anno scorso sono andata in montagna.",fa:"سال گذشته به کوهستان رفتم."}
],
dialogs:[
 {id:"7-1",t:"Com’è andata la vacanza?",tfa:"تعطیلات چطور بود؟",set:"بعد از تعطیلات، دو همکار گذشتهٔ خود را تعریف می‌کنند.",lines:[
  ["A","Ciao Sara! Non ti ho vista per due settimane. Dove sei stata?","سلام سارا! دو هفته ندیدمت. کجا بودی؟"],
  ["B","Ciao! Sono stata in Sicilia con mia sorella. È stato bellissimo!","سلام! با خواهرم در سیسیل بودم. بی‌نهایت زیبا بود!"],
  ["A","Che fortuna! Che tempo ha fatto?","چه خوش‌شانسی! هوا چطور بود؟"],
  ["B","Ha fatto caldo tutto il tempo, trenta gradi! Solo un giorno ha piovuto.","تمام مدت گرم بود، سی درجه! فقط یک روز باران آمد."],
  ["A","Che cosa avete fatto?","چه کارهایی کردید؟"],
  ["B","Abbiamo fatto il bagno tutti i giorni, abbiamo visitato Palermo e abbiamo mangiato pesce buonissimo.","هر روز آب‌تنی کردیم، پالرمو را بازدید کردیم و ماهی بسیار خوشمزه خوردیم."],
  ["A","Avete fatto delle escursioni?","گشت‌هایی هم رفتید؟"],
  ["B","Sì, siamo andate sull’Etna. Abbiamo camminato per quattro ore!","بله، به اتنا رفتیم. چهار ساعت پیاده‌روی کردیم!"],
  ["A","Ti è piaciuta la vacanza?","تعطیلات را دوست داشتی؟"],
  ["B","Moltissimo! E tu? Non sei andata in vacanza?","خیلی زیاد! و تو؟ به تعطیلات نرفتی؟"],
  ["A","No, quest’anno sono rimasto a casa. Ho lavorato e ho letto qualche libro.","نه، امسال خانه ماندم. کار کردم و چند کتاب خواندم."],
  ["B","Peccato! L’anno prossimo devi venire con noi.","حیف! سال آینده باید با ما بیایی."],
  ["A","Volentieri! Non sono mai stato in Sicilia.","با کمال میل! هرگز در سیسیل نبوده‌ام."]
 ]},
 {id:"7-2",t:"Un weekend in montagna",tfa:"یک آخر هفته در کوهستان",set:"تعریف یک سفر کوتاه با کمی بدشانسی.",lines:[
  ["A","Com’è andato il fine settimana in montagna?","آخر هفته در کوهستان چطور گذشت؟"],
  ["B","Insomma… siamo partiti sabato mattina presto, alle cinque.","بگو این‌طور… شنبه صبح زود، ساعت پنج، حرکت کردیم."],
  ["A","Alle cinque? Prestissimo!","ساعت پنج؟ خیلی زود!"],
  ["B","Sì, ma abbiamo perso l’autobus e siamo arrivati alle undici.","بله، اما اتوبوس را از دست دادیم و ساعت یازده رسیدیم."],
  ["A","Che peccato! E poi?","چه حیف! و بعد؟"],
  ["B","Poi abbiamo fatto un’escursione di tre ore. Il posto era meraviglioso.","بعد یک گشت سه‌ساعته رفتیم. آن مکان شگفت‌انگیز بود."],
  ["A","E il tempo?","و هوا؟"],
  ["B","All’inizio c’era il sole, poi è arrivato un temporale e ci siamo bagnati tutti.","اول آفتاب بود، بعد رعدوبرق آمد و همه خیس شدیم."],
  ["A","Oh no! Avete trovato un rifugio?","وای نه! پناهگاهی پیدا کردید؟"],
  ["B","Sì, abbiamo trovato un rifugio e abbiamo mangiato una zuppa calda.","بله، پناهگاهی پیدا کردیم و سوپ گرم خوردیم."],
  ["A","Alla fine è stata una bella giornata, allora!","پس در پایان روز خوبی بود!"],
  ["B","Sì, tutto sommato sì. Ma non ho dormito niente: il letto era durissimo!","بله، در مجموع بله. اما هیچ نخوابیدم: تخت بی‌نهایت سخت بود!"]
 ]},
 {id:"7-3",t:"Che tempo fa?",tfa:"هوا چطور است؟",set:"تلفنی، برنامه‌ریزی سفر با پیش‌بینی آب‌وهوا.",lines:[
  ["A","Pronto, mamma? Che tempo fa lì?","الو، مادر؟ آن‌جا هوا چطور است؟"],
  ["B","Fa freddo e tira molto vento. Ieri ha anche nevicato.","سرد است و باد شدیدی می‌آید. دیروز برف هم آمد."],
  ["A","Davvero? Qui invece c’è il sole e ci sono venti gradi.","واقعاً؟ این‌جا در عوض آفتاب است و بیست درجه."],
  ["B","Beata te! Hai guardato le previsioni per il weekend?","خوش به حالت! پیش‌بینی آخر هفته را دیدی؟"],
  ["A","Sì, sabato bel tempo, domenica nuvoloso con pioggia.","بله، شنبه هوای خوب، یک‌شنبه ابری با باران."],
  ["B","Allora venite sabato e partite domenica mattina.","پس شنبه بیایید و صبح یک‌شنبه حرکت کنید."],
  ["A","Buona idea. Abbiamo già prenotato l’albergo.","فکر خوبی است. هتل را از قبل رزرو کرده‌ایم."],
  ["B","Perfetto. Hai fatto la valigia?","عالی. چمدان را بسته‌ای؟"],
  ["A","Non ancora! La faccio stasera.","هنوز نه! امشب می‌بندم."]
 ]}
],
grammar:[
 {t:"Il passato prossimo con AVERE",tfa:"گذشتهٔ نقلی با avere",html:"<p>ساختار: <b class='it'>avere (حال) + participio passato</b>. برای بیشتر فعل‌های متعدی.</p><p>اسم مفعول باقاعده: <b class='it'>-are → -ato</b> (parlato)، <b class='it'>-ere → -uto</b> (creduto)، <b class='it'>-ire → -ito</b> (dormito).</p>",
  table:{head:["ضمیر","parlare","prendere","dormire"],rows:[["io","ho parlato","ho preso","ho dormito"],["tu","hai parlato","hai preso","hai dormito"],["lui/lei","ha parlato","ha preso","ha dormito"],["noi","abbiamo parlato","abbiamo preso","abbiamo dormito"],["voi","avete parlato","avete preso","avete dormito"],["loro","hanno parlato","hanno preso","hanno dormito"]]},
  egs:[["Ho mangiato una pizza buonissima.","یک پیتزای بسیار خوشمزه خوردم."],["Abbiamo visitato due musei.","دو موزه را بازدید کردیم."],["Hai dormito bene?","خوب خوابیدی؟"]],
  note:"با <b>avere</b> اسم مفعول تغییر نمی‌کند: <span class='it'>Maria ha mangiato</span>. منفی: <span class='it'>Non ho mangiato.</span>"},
 {t:"Il passato prossimo con ESSERE",tfa:"گذشتهٔ نقلی با essere",html:"<p>فعل‌های حرکت و حالت (andare, venire, partire, arrivare, tornare, uscire, entrare, salire, scendere, nascere, morire, rimanere, restare, essere, stare) و <b>همهٔ فعل‌های انعکاسی</b> با <b class='it'>essere</b> می‌آیند.</p><p>در این حالت اسم مفعول مثل صفت با فاعل <b>هماهنگ</b> می‌شود: -o, -a, -i, -e.</p>",
  table:{head:["ضمیر","andare (مذکر)","andare (مؤنث)"],rows:[["io","sono andato","sono andata"],["tu","sei andato","sei andata"],["lui / lei","è andato","è andata"],["noi","siamo andati","siamo andate"],["voi","siete andati","siete andate"],["loro","sono andati","sono andate"]]},
  egs:[["Sara è partita ieri.","سارا دیروز حرکت کرد."],["Siamo arrivati alle dieci.","ساعت ده رسیدیم."],["Le ragazze sono uscite con gli amici.","دخترها با دوستان بیرون رفتند."],["Sono stato al mare.","در دریا بودم."]],
  note:"فعل <b class='it'>essere</b> در گذشته همیشه <b class='it'>sono stato</b> می‌شود، نه «sono stato essere»."},

culture:{t:"Caffè culturale 7 — Le vacanze degli italiani",fa:"فرهنگ: تعطیلات ایتالیایی‌ها",html:"<p>تعطیلات اصلی ایتالیا در <b class='it'>agosto</b> است. حدود <b class='it'>Ferragosto</b> (۱۵ اوت) خیلی از شهرها خالی می‌شود و مردم به دریا می‌روند؛ بسیاری از مغازه‌ها تابلوی <span class='it'>chiuso per ferie</span> می‌زنند.</p><p>وقتی یک تعطیل رسمی نزدیک آخر هفته است، ایتالیایی‌ها <b class='it'>fare il ponte</b> می‌کنند: یک روز کاری بین را هم تعطیل می‌کنند و سفر کوتاه می‌روند.</p><p>در سواحل، بیشتر پلاژها <b class='it'>stabilimenti balneari</b> هستند: چتر و تخت آفتاب‌گیری اجاره‌ای (<span class='it'>ombrellone e lettini</span>) و ورودی دارد؛ کنارشان <span class='it'>spiaggia libera</span> رایگان هم هست. در کوهستان، اقامت در <span class='it'>rifugio</span> (پناهگاه کوهستانی) با شام گرم رایج است.</p>"}

phrases:[
 {w:"Di solito faccio la spesa al mercato, non al supermercato.",fa:"معمولاً از بازار خرید می‌کنم، نه از سوپرمارکت."},
 {w:"In Italia si mangia tardi; da noi invece si cena prima.",fa:"در ایتالیا دیر غذا می‌خورند؛ ولی پیش ما شام زودتر است."},
 {w:"A pranzo prendo solo un panino, invece la sera cucino.",fa:"ناهار فقط یک ساندویچ می‌خورم، در حالی که شب آشپزی می‌کنم."},
 {w:"Da noi il pane è diverso: è più basso e più morbido.",fa:"نان پیش ما فرق دارد: پهن‌تر و نرم‌تر است."},
 {w:"Buongiorno, desidera?",fa:"روز بخیر، چه میل دارید؟"},
 {w:"Vorrei un chilo di pomodori maturi.",fa:"یک کیلو گوجه‌فرنگی رسیده می‌خواهم."},
 {w:"Mi dà due etti di prosciutto crudo?",fa:"دویست گرم ژامبون خام به من می‌دهید؟"},
 {w:"Quanto ne vuole? — Mezzo chilo, grazie.",fa:"چقدر می‌خواهید؟ — نیم کیلو، ممنون."},
 {w:"Ne prendo un chilo.",fa:"یک کیلو از آن می‌گیرم."},
 {w:"Lo compro sempre qui.",fa:"همیشه آن را از این‌جا می‌خرم."},
 {w:"Le mele, le prendo al mercato.",fa:"سیب‌ها را از بازار می‌خرم."},
 {w:"Basta così, grazie.",fa:"همین کافی است، ممنون."},
 {w:"Altro? — No, grazie, basta.",fa:"چیز دیگری؟ — نه ممنون، کافی است."},
 {w:"Quant’è in tutto?",fa:"روی‌هم چقدر می‌شود؟"},
 {w:"Mi può fare lo scontrino?",fa:"می‌توانید رسید بدهید؟"},
 {w:"Dove posso trovare il parmigiano?",fa:"پارمزان را کجا می‌توانم پیدا کنم؟"},
 {w:"In Italia si mangia molta pasta.",fa:"در ایتالیا پاستای زیادی می‌خورند."},
 {w:"Da noi si beve molto tè.",fa:"در کشور ما چای زیادی می‌نوشند."},
 {w:"Che cosa si mangia in questa regione?",fa:"در این منطقه چه می‌خورند؟"},
 {w:"Mi dai la ricetta del tiramisù?",fa:"دستور پخت تیرامیسو را به من می‌دهی؟"},
 {w:"Prima si mescolano le uova con lo zucchero.",fa:"اول تخم‌مرغ‌ها را با شکر هم می‌زنند."},
 {w:"Quanto sale ci vuole? — Quanto basta.",fa:"چقدر نمک لازم است؟ — به مقدار لازم."},
 {w:"Sono vegetariano, non mangio carne.",fa:"گیاه‌خوار هستم، گوشت نمی‌خورم."},
 {w:"Preferisco i prodotti freschi e di stagione.",fa:"محصولات تازه و فصلی را ترجیح می‌دهم."}
],
dialogs:[
 {id:"8-1",t:"Dal fruttivendolo",tfa:"در میوه‌فروشی",set:"خرید با مقدار، ضمیر مفعولی و قیمت.",lines:[
  ["A","Buongiorno, desidera?","روز بخیر، چه میل دارید؟"],
  ["B","Vorrei un chilo di pomodori, per favore. Sono maturi?","یک کیلو گوجه‌فرنگی می‌خواهم، لطفاً. رسیده هستند؟"],
  ["A","Sì, sono buonissimi, li ho presi questa mattina.","بله، بی‌نهایت خوشمزه‌اند، امروز صبح آورده‌ام‌شان."],
  ["B","Perfetto, ne prendo un chilo. E le zucchine, quanto costano?","عالی، یک کیلو از آن‌ها می‌گیرم. و کدوها چقدر هستند؟"],
  ["A","Due euro al chilo.","دو یورو هر کیلو."],
  ["B","Mezzo chilo, allora. Le mele le avete?","پس نیم کیلو. سیب دارید؟"],
  ["A","Sì, le abbiamo, ma sono finite quelle italiane. Ci sono solo le tedesche.","بله داریم، اما ایتالیایی‌هایش تمام شده. فقط آلمانی هست."],
  ["B","Va bene, ne prendo quattro. E un mazzo di basilico.","باشد، چهارتا از آن‌ها می‌گیرم. و یک دسته ریحان."],
  ["A","Altro?","چیز دیگری؟"],
  ["B","No, basta così, grazie. Quant’è in tutto?","نه، همین کافی است، ممنون. روی‌هم چقدر می‌شود؟"],
  ["A","Sono sei euro e ottanta.","شش یورو و هشتاد سنت."],
  ["B","Ecco a lei. Mi dà una busta, per favore?","بفرمایید. یک کیسه به من می‌دهید لطفاً؟"],
  ["A","Certo. Grazie e buona giornata!","حتماً. ممنون و روز خوبی داشته باشید!"]
 ]},
 {id:"8-2",t:"In macelleria e in salumeria",tfa:"در قصابی و پنیرفروشی",set:"سفارش با «etto» و ضمیرهای lo / la / ne.",lines:[
  ["A","Buongiorno! Che cosa le do?","روز بخیر! چه به شما بدهم؟"],
  ["B","Vorrei del prosciutto crudo, quello toscano.","کمی ژامبون خام می‌خواهم، آن توسکانی."],
  ["A","Quanto ne vuole?","چقدر از آن می‌خواهید؟"],
  ["B","Due etti. Lo tagli molto sottile, per favore.","دویست گرم. خیلی نازک برش بزنید لطفاً."],
  ["A","Certo. Vuole anche del formaggio?","حتماً. پنیر هم می‌خواهید؟"],
  ["B","Sì, un pezzo di parmigiano. Lo grattugio per la pasta.","بله، یک تکه پارمزان. برای پاستا رنده‌اش می‌کنم."],
  ["A","Questo è stagionato trentasei mesi, è buonissimo.","این سی‌وشش ماه کهنه شده، بی‌نهایت خوشمزه است."],
  ["B","Perfetto, ne prendo tre etti. E della mozzarella, ne avete?","عالی، سیصد گرم از آن می‌گیرم. و موزارلا دارید؟"],
  ["A","Sì, la facciamo arrivare ogni giorno dalla Campania.","بله، هر روز از کامپانیا می‌آوریم‌اش."],
  ["B","Ne prendo due. Grazie!","دو تا از آن می‌گیرم. ممنون!"],
  ["A","Sono dodici euro e cinquanta. Vuole lo scontrino?","دوازده یورو و پنجاه سنت. رسید می‌خواهید؟"],
  ["B","Sì, grazie. Arrivederci!","بله، ممنون. خداحافظ!"]
 ]},
 {id:"8-3",t:"La ricetta della nonna",tfa:"دستور پخت مادربزرگ",set:"گرفتن دستور پخت با ساختار غیرشخصی si.",lines:[
  ["A","Nonna, mi dai la ricetta del tuo sugo?","مادربزرگ، دستور پخت سُس خودت را به من می‌دهی؟"],
  ["B","Certo! Allora, prima si taglia la cipolla e l’aglio.","حتماً! خب، اول پیاز و سیر را خرد می‌کنند."],
  ["A","E poi?","و بعد؟"],
  ["B","Poi si mette l’olio in padella e si fa cuocere a fuoco lento.","بعد روغن را در ماهیتابه می‌ریزند و با شعلهٔ کم می‌پزند."],
  ["A","Quanto tempo ci vuole?","چقدر زمان لازم است؟"],
  ["B","Dieci minuti. Poi si aggiungono i pomodori e si mescola.","ده دقیقه. بعد گوجه‌ها را اضافه می‌کنند و هم می‌زنند."],
  ["A","Quanto sale ci metto?","چقدر نمک بگذارم؟"],
  ["B","Quanto basta, e un po’ di basilico alla fine.","به مقدار لازم، و در پایان کمی ریحان."],
  ["A","E la pasta, quando la butto?","و پاستا را کِی بریزم؟"],
  ["B","Quando il sugo è quasi pronto. Si cuoce al dente, otto minuti.","وقتی سُس تقریباً آماده است. دندان‌گیر پخته می‌شود، هشت دقیقه."],
  ["A","Da noi in Iran si mette anche lo zafferano nel riso.","در کشور ما در ایران زعفران هم در برنج می‌گذارند."],
  ["B","Che buono! Devi farlo assaggiare anche a me.","چه خوب! باید به من هم بچشانی."],
  ["A","Volentieri, la prossima volta cucino io!","با کمال میل، دفعهٔ بعد من آشپزی می‌کنم!"]
 ]}
],
grammar:[
 {t:"I partitivi al singolare",tfa:"پارتیتیو در مفرد",html:"<p>برای «مقداری از» با اسم‌های غیرقابل‌شمارش، از <b class='it'>di + حرف تعریف</b> استفاده می‌شود:</p>",
  table:{head:["ترکیب","شکل","مثال"],rows:[["di + il","del","Vorrei del pane."],["di + lo","dello","Compro dello zucchero."],["di + l’ (مذکر)","dell’","Prendo dell’olio."],["di + la","della","Vorrei della carne."],["di + l’ (مؤنث)","dell’","Compro dell’acqua."]]},
  egs:[["Vuole del formaggio?","کمی پنیر می‌خواهید؟"],["Bevo dell’acqua frizzante.","آب گازدار می‌نوشم."],["Ho comprato della frutta.","مقداری میوه خریدم."]],
  note:"مقایسه: <b class='it'>del pane</b> (مقداری نان) در برابر <b class='it'>il pane</b> (نان به‌طور کلی) و <b class='it'>un panino</b> (یک عدد نان ساندویچی)."},
 {t:"I pronomi diretti: lo, la, li, le",tfa:"ضمیرهای مفعولی مستقیم",html:"<p>جای مفعول مستقیم (چه چیزی را / چه کسی را) می‌نشینند و <b>پیش از فعل صرف‌شده</b> می‌آیند.</p>",
  table:{head:["مفعول","ضمیر","مثال"],rows:[["مذکر مفرد","lo","Il prosciutto? Lo compro qui."],["مؤنث مفرد","la","La mozzarella? La prendo fresca."],["مذکر جمع","li","I pomodori? Li compro al mercato."],["مؤنث جمع","le","Le mele? Le prendo tedesche."]]},
  egs:[["— Compri il pane? — Sì, lo compro ogni giorno.","— نان می‌خری؟ — بله، هر روز می‌خرم."],["— Mangi la carne? — No, non la mangio.","— گوشت می‌خوری؟ — نه، نمی‌خورم."],["Questi gamberi? Li ho presi ieri.","این میگوها؟ دیروز گرفتم‌شان."]],
  note:"پیش از واکه می‌توان کوتاه کرد: <span class='it'>l’ho comprato, l’ho presa</span>. در passato prossimo با avere، اسم مفعول با ضمیرهای lo/la/li/le هماهنگ می‌شود: <span class='it'>Le ho comprate.</span>"},
 {t:"Il pronome NE",tfa:"ضمیر ne",html:"<p><b class='it'>ne</b> = «از آن / از آن‌ها» و وقتی می‌آید که <b>مقدار یا تعداد</b> گفته می‌شود.</p>",
  table:{head:["پرسش","پاسخ با ne","معنی"],rows:[["Quanto pane vuoi?","Ne voglio un chilo.","یک کیلو از آن می‌خواهم."],["Quante mele compri?","Ne compro quattro.","چهارتا از آن‌ها می‌خرم."],["Vuoi del formaggio?","Sì, ne prendo due etti.","بله، دویست گرم از آن می‌گیرم."],["Hai delle uova?","No, non ne ho.","نه، ندارم."]]},
  egs:[["— Quanti pomodori hai preso? — Ne ho presi due chili.","— چند کیلو گوجه گرفتی؟ — دو کیلو گرفتم."],["Di Parmigiano ne prendo sempre un pezzo.","پارمزان همیشه یک تکه می‌گیرم."]],
  note:"تفاوت مهم: <span class='it'>Lo compro</span> = آن را می‌خرم (کل چیز) / <span class='it'>Ne compro un chilo</span> = یک کیلو از آن می‌خرم (مقدار)."},
 {t:"La costruzione impersonale: si + verbo",tfa:"ساختار غیرشخصی si",html:"<p>برای گفتن «مردم چنین می‌کنند / این‌طور معمول است» از <b class='it'>si + سوم‌شخص</b> استفاده می‌شود.</p><ul><li>مفعول مفرد یا بدون مفعول → فعل <b>مفرد</b>: <span class='it'>Si mangia bene.</span></li><li>مفعول جمع → فعل <b>جمع</b>: <span class='it'>Si mangiano molti dolci.</span></li></ul>",
  table:{head:["مثال","معنی"],rows:[["In Italia si beve molto caffè.","در ایتالیا قهوهٔ زیادی می‌نوشند."],["Si mangia molta pasta.","پاستای زیادی می‌خورند."],["Si comprano i prodotti al mercato.","محصولات را از بازار می‌خرند."],["Come si dice questo in italiano?","این به ایتالیایی چه می‌شود؟"],["A che ora si cena?","ساعت چند شام می‌خورند؟"],["Qui si parla anche tedesco.","این‌جا آلمانی هم صحبت می‌کنند."]]},
  egs:[["Da noi si mangia molto riso.","در کشور ما برنج زیادی می‌خورند."],["In questa regione si fa un vino ottimo.","در این منطقه شراب عالی تولید می‌کنند."]],
  note:"برای دستور پخت خیلی رایج است: <span class='it'>si taglia, si mescola, si aggiunge, si cuoce</span>."},
 {t:"Le quantità",tfa:"مقدارها",html:"<p>الگو: <b class='it'>مقدار + di + اسم</b> (بدون حرف تعریف).</p>",
  table:{head:["مقدار","مثال"],rows:[["un chilo di","un chilo di pomodori"],["mezzo chilo di","mezzo chilo di carne"],["due etti di","due etti di prosciutto"],["un litro di","un litro di latte"],["una bottiglia di","una bottiglia di vino"],["un pacchetto di","un pacchetto di pasta"],["un barattolo di","un barattolo di miele"],["una fetta di","una fetta di torta"],["un pezzo di","un pezzo di formaggio"],["un po’ di","un po’ di sale"]]},
  egs:[["Vorrei mezzo chilo di mele.","نیم کیلو سیب می‌خواهم."],["Ci vogliono due etti di zucchero.","دویست گرم شکر لازم است."]]},
 {t:"Le stagioni",tfa:"فصل‌ها",html:"<p>با <b class='it'>in</b> یا <b class='it'>di</b>: <span class='it'>in primavera / di primavera</span>. برای «در تابستان امسال»: <span class='it'>quest’estate</span>.</p>",
  egs:[["In estate mangio molta frutta.","در تابستان میوهٔ زیادی می‌خورم."],["D’inverno si mangiano piatti più pesanti.","در زمستان غذاهای سنگین‌تر می‌خورند."],["Quest’autunno ho fatto un corso di cucina.","این پاییز در یک کلاس آشپزی شرکت کردم."]]}
],

culture:{t:"Caffè culturale 8 — La spesa e i prodotti tipici",fa:"فرهنگ: خرید و محصولات محلی",html:"<p>خیلی از ایتالیایی‌ها هنوز خرید روزانه را از مغازه‌های تخصصی می‌کنند: <span class='it'>dal panettiere, dal macellaio, dal fruttivendolo</span>. در این مغازه‌ها معمولاً باید نوبت بگیری؛ عبارت <b class='it'>Chi è l’ultimo?</b> («آخرین نفر کیست؟») برای همین است.</p><p>واحد <b class='it'>etto</b> (۱۰۰ گرم) در ایتالیا خیلی رایج است: <span class='it'>due etti di prosciutto</span>. روی برچسب محصولات، نشان‌های <b class='it'>DOP</b> و <b class='it'>IGP</b> یعنی محصول منطقه‌ای و ثبت‌شده است؛ مثل <span class='it'>Parmigiano Reggiano DOP</span> یا <span class='it'>Aceto Balsamico di Modena IGP</span>.</p><p>آشپزی ایتالیایی شدیداً منطقه‌ای است: شمال کره و برنج، مرکز گوشت و نان بی‌نمک، جنوب روغن زیتون و پاستا. پرسیدن <span class='it'>Che cosa si mangia qui?</span> بهترین راه شروع گفت‌وگو با یک فروشنده است.</p>"}

dialogs:[
 {id:"9-1",t:"La giornata di Marco",tfa:"روز مارکو",set:"توصیف یک روز کاری با فعل‌های انعکاسی.",lines:[
  ["A","Marco, com’è la tua giornata tipo?","مارکو، روز معمولی تو چطور است؟"],
  ["B","Mi sveglio alle sei, ma mi alzo alle sei e venti.","ساعت شش بیدار می‌شوم، اما شش‌وبیست بلند می‌شوم."],
  ["A","Presto! E che cosa fai prima di uscire?","زود! و پیش از بیرون رفتن چه می‌کنی؟"],
  ["B","Mi faccio la doccia, mi vesto e faccio colazione: caffè e due fette biscottate.","دوش می‌گیرم، لباس می‌پوشم و صبحانه می‌خورم: قهوه و دو نان تست."],
  ["A","A che ora inizi a lavorare?","ساعت چند کار را شروع می‌کنی؟"],
  ["B","Alle otto e mezza. Prendo l’autobus delle otto.","هشت‌ونیم. اتوبوس ساعت هشت را می‌گیرم."],
  ["A","E la pausa pranzo?","و وقفهٔ ناهار؟"],
  ["B","Dalle dodici e mezza all’una e mezza. Di solito mangio in mensa.","از دوازده‌ونیم تا یک‌ونیم. معمولاً در غذاخوری اداره می‌خورم."],
  ["A","Quando finisci?","کِی تمام می‌کنی؟"],
  ["B","Alle cinque e mezza, ma il giovedì faccio gli straordinari fino alle sette.","پنج‌ونیم، اما پنج‌شنبه‌ها تا هفت اضافه‌کاری می‌کنم."],
  ["A","E la sera?","و عصر؟"],
  ["B","Torno a casa, cucino, poi mi riposo sul divano e guardo una serie.","به خانه برمی‌گردم، آشپزی می‌کنم، بعد روی کاناپه استراحت می‌کنم و سریال می‌بینم."],
  ["A","A che ora ti addormenti?","ساعت چند خوابت می‌برد؟"],
  ["B","Verso le undici e mezza. E il sabato mi alzo alle dieci!","حدود یازده‌ونیم. و شنبه ساعت ده بلند می‌شوم!"],
  ["A","Beato te, io mi sveglio alle cinque anche il sabato.","خوش به حالت، من شنبه هم ساعت پنج بیدار می‌شوم."]
 ]},
 {id:"9-2",t:"L’agenda di Laura",tfa:"دفتر برنامهٔ لائورا",set:"هماهنگ کردن یک قرار با نگاه به برنامهٔ هفته.",lines:[
  ["A","Ciao Laura, sei libera mercoledì pomeriggio?","سلام لائورا، چهارشنبه بعدازظهر آزادی؟"],
  ["B","Un momento, guardo l’agenda… No, alle tre ho una riunione.","یک لحظه، دفتر برنامه را نگاه می‌کنم… نه، ساعت سه جلسه دارم."],
  ["A","E giovedì?","و پنج‌شنبه؟"],
  ["B","Giovedì lavoro fino alle sette, faccio il turno lungo.","پنج‌شنبه تا هفت کار می‌کنم، شیفت بلند دارم."],
  ["A","Allora venerdì?","پس جمعه؟"],
  ["B","Venerdì sì, ma solo dopo le cinque. Prima ho un appuntamento dal dentista.","جمعه بله، اما فقط بعد از پنج. قبلش وقت دندان‌پزشکی دارم."],
  ["A","Va bene alle sei? Facciamo due passi e poi un aperitivo.","ساعت شش خوب است؟ کمی قدم می‌زنیم و بعد یک آپریتیوو."],
  ["B","Perfetto! Ci vediamo alle sei in piazza.","عالی! ساعت شش در میدان می‌بینمت."],
  ["A","Porto anche Giulia?","جولیا را هم بیاورم؟"],
  ["B","Certo, così festeggiamo: sabato è il suo compleanno!","حتماً، این‌طور جشن می‌گیریم: شنبه تولدش است!"],

phrases:[
 {w:"Hai fratelli o sorelle?",fa:"برادر یا خواهر داری؟"},
 {w:"Sono figlio unico. / Sono figlia unica.",fa:"تک‌فرزند هستم."},
 {w:"Nella mia famiglia siamo in cinque.",fa:"در خانوادهٔ ما پنج نفریم."},
 {w:"Questa è una foto della mia famiglia.",fa:"این عکسی از خانوادهٔ من است."},
 {w:"Chi è questo? — È mio fratello maggiore.",fa:"این کیست؟ — برادر بزرگ‌ترم است."},
 {w:"Com’è tua sorella? — È alta, magra e molto simpatica.",fa:"خواهرت چطور است؟ — قدبلند، لاغر و خیلی خوش‌مشرب."},
 {w:"A chi assomigli? — Assomiglio a mio padre.",fa:"شبیه کی هستی؟ — شبیه پدرم هستم."},
 {w:"I miei genitori abitano in Iran.",fa:"پدر و مادرم در ایران زندگی می‌کنند."},
 {w:"Mio marito è il più paziente della famiglia.",fa:"شوهرم صبورترین فرد خانواده است."},
 {w:"Questa è la casa dei miei nonni.",fa:"این خانهٔ پدربزرگ و مادربزرگم است."},
 {w:"Vi siete sposati in chiesa? — No, in municipio.",fa:"در کلیسا ازدواج کردید؟ — نه، در شهرداری."},
 {w:"Quando vi siete conosciuti?",fa:"کِی با هم آشنا شدید؟"},
 {w:"Ci siamo conosciuti all’università.",fa:"در دانشگاه با هم آشنا شدیم."},
 {w:"Che cosa regaliamo agli sposi?",fa:"به عروس و داماد چه هدیه بدهیم؟"},
 {w:"Facciamo una lista nozze?",fa:"فهرست هدیهٔ عروسی درست کنیم؟"},
 {w:"Siccome non hanno la lavastoviglie, regaliamo quella.",fa:"چون ماشین ظرفشویی ندارند، همان را هدیه بدهیم."},
 {w:"Tanti auguri agli sposi!",fa:"به عروس و داماد تبریک فراوان!"}
],
dialogs:[
 {id:"10-1",t:"Una foto di famiglia",tfa:"یک عکس خانوادگی",set:"توصیف عکس با صفت‌های ملکی و ظاهر و شخصیت.",lines:[
  ["A","Che bella foto! È la tua famiglia?","چه عکس زیبایی! خانوادهٔ توست؟"],
  ["B","Sì, questa è la foto del matrimonio di mia sorella.","بله، این عکس عروسی خواهرم است."],
  ["A","Chi è questo signore alto con gli occhiali?","این آقای قدبلند با عینک کیست؟"],
  ["B","È mio padre. Ha i capelli bianchi, ma è ancora molto attivo.","پدرم است. موهایش سفید است، اما هنوز خیلی فعال است."],
  ["A","E questa signora accanto a lui?","و این خانم کنار او؟"],
  ["B","È mia madre. È più bassa di lui e molto più chiacchierona!","مادرم است. از او کوتاه‌تر است و خیلی پرحرف‌تر!"],
  ["A","Tua sorella com’è?","خواهرت چطور است؟"],
  ["B","È la sposa, quella con il bouquet. È alta, magra, ha i capelli ricci e neri.","عروس است، آن که دسته‌گل دارد. قدبلند، لاغر، با موی فرفری و مشکی."],
  ["A","E suo marito?","و شوهرش؟"],
  ["B","Si chiama Paolo. È il più simpatico della famiglia, sempre allegro.","اسمش پائولو است. خوش‌مشرب‌ترین فرد خانواده است، همیشه شاد."],
  ["A","Quanti fratelli siete?","چند خواهر و برادرید؟"],
  ["B","Siamo in tre: io, mia sorella e nostro fratello minore, che è ancora studente.","سه نفریم: من، خواهرم و برادر کوچک‌ترمان که هنوز دانشجوست."],
  ["A","E i tuoi nonni?","و پدربزرگ و مادربزرگت؟"],
  ["B","I miei nonni non ci sono più, purtroppo. Questa foto è del 2019.","متأسفانه پدربزرگ و مادربزرگم دیگر نیستند. این عکس مال ۲۰۱۹ است."],
  ["A","Mi dispiace. Ma siete una famiglia bellissima!","متأسفم. اما خانوادهٔ بسیار زیبایی هستید!"]
 ]},
 {id:"10-2",t:"Il regalo di nozze",tfa:"هدیهٔ عروسی",set:"انتخاب هدیه با perché و siccome و برترین نسبی.",lines:[
  ["A","Allora, che cosa regaliamo a Marta e Paolo?","خب، به مارتا و پائولو چه هدیه بدهیم؟"],
  ["B","Non so. Loro hanno fatto la lista nozze in un negozio.","نمی‌دانم. آن‌ها در یک مغازه فهرست هدیهٔ عروسی درست کرده‌اند."],
  ["A","Ho visto la lista: c’è una lavastoviglie, un servizio di piatti e una macchina del caffè.","فهرست را دیدم: یک ماشین ظرفشویی، یک سرویس بشقاب و یک قهوه‌ساز هست."],
  ["B","Siccome la lavastoviglie costa troppo, prendiamo la macchina del caffè.","چون ماشین ظرفشویی زیادی گران است، قهوه‌ساز را می‌گیریم."],
  ["A","Ma è il regalo più economico della lista!","اما ارزان‌ترین هدیهٔ فهرست است!"],
  ["B","Vero. Possiamo dividerlo con Giulia e suo marito.","درست است. می‌توانیم با جولیا و شوهرش تقسیمش کنیم."],
  ["A","Buona idea. E perché non aggiungiamo anche dei bicchieri?","فکر خوبی است. و چرا چند لیوان هم اضافه نکنیم؟"],
  ["B","Perfetto. Marta è la persona più difficile della famiglia per i regali!","عالی. مارتا سخت‌ترین فرد خانواده برای هدیه خریدن است!"],
  ["A","È vero, ma siccome le piace il caffè, questa volta siamo sicuri.","درست است، اما چون قهوه دوست دارد، این بار مطمئنیم."],
  ["B","Quando è il matrimonio?","عروسی کِی است؟"],
  ["A","Il dodici settembre. Loro si sono sposati in municipio a maggio, questa è solo la festa.","دوازدهم سپتامبر. آن‌ها در مه در شهرداری ازدواج کردند، این فقط جشن است."],
  ["B","Ah, capito. Allora abbiamo tempo. Compriamo il regalo sabato?","آه، فهمیدم. پس وقت داریم. هدیه را شنبه بخریم؟"],
  ["A","Sì, andiamo insieme. Così scegliamo il più bello.","بله، با هم برویم. این‌طور زیباترینش را انتخاب می‌کنیم."]
 ]},
 {id:"10-3",t:"Come vi siete conosciuti?",tfa:"چطور با هم آشنا شدید؟",set:"گذشتهٔ نقلی فعل‌های انعکاسی در یک گفت‌وگوی دوستانه.",lines:[
  ["A","Raccontami: come vi siete conosciuti tu e tuo marito?","برایم تعریف کن: تو و شوهرت چطور با هم آشنا شدید؟"],
  ["B","Ci siamo conosciuti all’università, nel 2015.","در دانشگاه در سال ۲۰۱۵ با هم آشنا شدیم."],
  ["A","E quando vi siete innamorati?","و کِی عاشق شدید؟"],
  ["B","Subito! Lui si è innamorato prima di me, però.","فوراً! البته او پیش از من عاشق شد."],
  ["A","E quando vi siete sposati?","و کِی ازدواج کردید؟"],
  ["B","Ci siamo sposati nel 2019, in un piccolo paese in Toscana.","در سال ۲۰۱۹ در روستایی کوچک در توسکانی ازدواج کردیم."],
  ["A","Che romantico! Vi siete trasferiti dopo?","چه رمانتیک! بعد نقل مکان کردید؟"],
  ["B","Sì, ci siamo trasferiti a Milano per lavoro. Io mi sono laureata in economia.","بله، برای کار به میلان نقل مکان کردیم. من در اقتصاد فارغ‌التحصیل شدم."],
  ["A","E i vostri genitori erano contenti?","و پدر و مادرهایتان خوشحال بودند؟"],
  ["B","Molto! I suoi genitori si sono commossi al matrimonio.","خیلی! پدر و مادرش در عروسی بغض کردند."],
  ["A","E adesso pensate ai figli?","و حالا به فکر فرزند هستید؟"],
  ["B","Sì, ne parliamo spesso. Ma prima vogliamo viaggiare un po’!","بله، اغلب دربارهٔ بچه‌ها حرف می‌زنیم. اما اول می‌خواهیم کمی سفر کنیم!"]
 ]}
],
grammar:[
 {t:"Gli aggettivi possessivi",tfa:"صفت‌های ملکی",html:"<p>صفت ملکی در ایتالیایی با <b>چیزی که مالک آن هستی</b> هماهنگ می‌شود، نه با صاحبش. مثلاً <span class='it'>il suo libro</span> می‌تواند «کتاب او (مرد)» یا «کتاب او (زن)» باشد.</p>",
  table:{head:["مالک","مذکر مفرد","مؤنث مفرد","مذکر جمع","مؤنث جمع"],rows:[["من","il mio","la mia","i miei","le mie"],["تو","il tuo","la tua","i tuoi","le tue"],["او / شما رسمی","il suo","la sua","i suoi","le sue"],["ما","il nostro","la nostra","i nostri","le nostre"],["شما (جمع)","il vostro","la vostra","i vostri","le vostre"],["آن‌ها","il loro","la loro","i loro","le loro"]]},
  egs:[["Mia sorella è insegnante.","خواهرم معلم است."],["I miei genitori abitano a Shiraz.","پدر و مادرم در شیراز زندگی می‌کنند."],["Il nostro appartamento è piccolo.","آپارتمان ما کوچک است."],["Le loro figlie sono gemelle.","دخترهای آن‌ها دوقلو هستند."]],
  note:"<b class='it'>loro</b> هیچ‌وقت تغییر نمی‌کند: il loro padre, la loro madre, i loro figli, le loro case."},
 {t:"L’articolo con i possessivi",tfa:"حرف تعریف با ملکی",html:"<p>قاعدهٔ کلی: <b>حرف تعریف + ملکی + اسم</b> → <span class='it'>il mio libro, la tua casa, i nostri amici</span>.</p><p><b>استثنای مهم:</b> با اعضای خانواده در حالت <b>مفرد</b>، حرف تعریف نمی‌آید:</p><ul><li><span class='it'>mio padre, mia madre, mio fratello, mia sorella, mio marito, mia moglie, mio figlio</span></li><li>اما در جمع حرف تعریف می‌آید: <span class='it'>i miei fratelli, le mie sorelle</span></li><li>با صفت اضافه یا شکل کوچک‌شده هم می‌آید: <span class='it'>il mio fratello maggiore, la mia sorellina, il mio papà</span></li><li>با <b class='it'>loro</b> همیشه می‌آید: <span class='it'>il loro padre, la loro sorella</span></li><li><span class='it'>i miei genitori</span> جمع است، پس حرف تعریف دارد.</li></ul>",
  table:{head:["درست","نادرست","دلیل"],rows:[["mio fratello","il mio fratello","خانواده، مفرد"],["i miei fratelli","miei fratelli","جمع"],["la mia sorellina","mia sorellina","شکل کوچک‌شده"],["il mio papà","mio papà","شکل خودمانی"],["il loro fratello","loro fratello","با loro همیشه"],["la mia casa","mia casa","خانه عضو خانواده نیست"]]},
  egs:[["Mia moglie si chiama Anna.","همسرم آنا نام دارد."],["Il mio fratellino ha cinque anni.","برادر کوچکم پنج سال دارد."],["I miei nonni sono in Iran.","پدربزرگ و مادربزرگم در ایران هستند."]]},
 {t:"Il superlativo relativo",tfa:"برترین نسبی",html:"<p>ساختار: <b class='it'>حرف تعریف + più / meno + صفت + di / tra</b> = «ترین ... در میان ...».</p>",
  table:{head:["مثال","معنی"],rows:[["Marco è il più alto della famiglia.","مارکو قدبلندترین فرد خانواده است."],["Sara è la più simpatica di tutti.","سارا خوش‌مشرب‌ترینِ همه است."],["Sono i regali più belli.","زیباترین هدیه‌ها هستند."],["È il meno caro del negozio.","ارزان‌ترینِ مغازه است."],["È la città più antica d’Italia.","کهن‌ترین شهر ایتالیاست."]]},
  egs:[["Mio marito è il più paziente della famiglia.","شوهرم صبورترین فرد خانواده است."],["Questa è la torta più buona del mondo!","این خوشمزه‌ترین کیک دنیاست!"]],
  note:"مقایسه با برترین مطلق درس ۷: <span class='it'>bellissimo</span> = خیلی زیبا (بدون مقایسه) / <span class='it'>il più bello</span> = زیباترین (با مقایسه). شکل‌های بی‌قاعده: <span class='it'>il migliore</span> (بهترین)، <span class='it'>il peggiore</span> (بدترین)."},
 {t:"Il passato prossimo dei riflessivi",tfa:"گذشتهٔ نقلی فعل‌های انعکاسی",html:"<p>همهٔ فعل‌های انعکاسی با <b class='it'>essere</b> می‌آیند و اسم مفعول با فاعل هماهنگ می‌شود.</p><p>ساختار: <b class='it'>ضمیر انعکاسی + essere + participio</b></p>",
  table:{head:["ضمیر","svegliarsi (مذکر)","svegliarsi (مؤنث)"],rows:[["io","mi sono svegliato","mi sono svegliata"],["tu","ti sei svegliato","ti sei svegliata"],["lui / lei","si è svegliato","si è svegliata"],["noi","ci siamo svegliati","ci siamo svegliate"],["voi","vi siete svegliati","vi siete svegliate"],["loro","si sono svegliati","si sono svegliate"]]},
  egs:[["Ieri mi sono alzato alle sette.","دیروز ساعت هفت بلند شدم."],["Ci siamo sposati nel 2019.","در ۲۰۱۹ ازدواج کردیم."],["Sara si è laureata a giugno.","سارا در ژوئن فارغ‌التحصیل شد."],["A che ora vi siete addormentati?","ساعت چند خوابتان برد؟"]],
  note:"منفی: <span class='it'>Non mi sono svegliato presto.</span> — non پیش از ضمیر انعکاسی می‌آید."},
 {t:"Perché e siccome",tfa:"perché و siccome",html:"<p>هر دو «چون / زیرا» هستند، اما جایشان فرق دارد:</p><ul><li><b class='it'>perché</b> معمولاً <b>وسط</b> جمله می‌آید: <span class='it'>Non esco perché sono stanco.</span></li><li><b class='it'>siccome</b> همیشه <b>اول</b> جمله می‌آید: <span class='it'>Siccome sono stanco, non esco.</span></li></ul>",
  table:{head:["ساختار","مثال","معنی"],rows:[["… perché …","Regalo il caffè perché le piace.","قهوه هدیه می‌دهم چون دوست دارد."],["Siccome … , …","Siccome le piace il caffè, lo regalo.","چون قهوه دوست دارد، آن را هدیه می‌دهم."],["Perché …?","Perché non vai?","چرا نمی‌روی؟"]]},
  egs:[["Siccome piove, restiamo a casa.","چون باران می‌آید، خانه می‌مانیم."],["Restiamo a casa perché piove.","خانه می‌مانیم چون باران می‌آید."]],
  note:"<b class='it'>siccome</b> هرگز وسط جمله نمی‌آید. این یکی از رایج‌ترین اشتباهات زبان‌آموزان است."},
 {t:"Descrivere una fotografia",tfa:"توصیف یک عکس",html:"<p>عبارت‌های کاربردی برای اشاره به افراد در عکس:</p>",
  table:{head:["عبارت","معنی"],rows:[["Questa è una foto di…","این عکسی از ... است"],["Questo è… / Questa è…","این (آقا / خانم) ... است"],["Quello con gli occhiali è…","آن که عینک دارد ... است"],["Accanto a lui / a lei…","کنار او…"],["In primo piano…","در پیش‌زمینه…"],["Sullo sfondo…","در پس‌زمینه…"],["A destra / a sinistra…","در سمت راست / چپ…"],["Sembra…","به نظر می‌رسد…"]]},
  egs:[["In primo piano ci sono i miei genitori.","در پیش‌زمینه پدر و مادرم هستند."],["Quella con i capelli ricci è mia cugina.","آن با موی فرفری دخترعمویم است."],["Sullo sfondo si vede il mare.","در پس‌زمینه دریا دیده می‌شود."]]}

dialogs:[
 {id:"12-1",t:"Ricordi d'infanzia",tfa:"خاطرات کودکی",set:"دو دوست در اتوبوس دربارهٔ کودکی‌شان حرف می‌زنند.",
  lines:[
   ["A","Senti, ma tu dove sei cresciuta?","ببین، تو کجا بزرگ شدی؟"],
   ["B","In un paese piccolo, in Toscana. Da bambina abitavo in campagna.","در یک شهر کوچک در توسکانی. در کودکی در روستا زندگی می‌کردم."],
   ["A","E com'era?","چه شکلی بود؟"],
   ["B","Bellissimo. Avevamo un cortile grande e ogni pomeriggio giocavo con i vicini.","خیلی قشنگ. یک حیاط بزرگ داشتیم و هر بعدازظهر با همسایه‌ها بازی می‌کردم."],
   ["A","Che bello. Io invece sono cresciuto in città.","چه خوب. من برعکس در شهر بزرگ شدم."],
   ["B","E non ti piaceva?","و خوشت نمی‌آمد؟"],
   ["A","Mah, mi piaceva, ma non potevo mai uscire da solo. Mia madre era troppo ansiosa.","خب، خوشم می‌آمد، اما هیچ‌وقت نمی‌توانستم تنها بیرون بروم. مادرم خیلی نگران بود."],
   ["B","Da noi invece tutti si conoscevano.","در شهر ما برعکس، همه همدیگر را می‌شناختند."],
   ["A","Sì, immagino. A quei tempi era tutto più semplice, no?","بله، حدس می‌زنم. آن روزها همه‌چیز ساده‌تر بود، نه؟"],
   ["B","Forse. Però io sognavo la città e tu sognavi il paese.","شاید. اما من شهر را خواب می‌دیدم و تو روستا را."]
  ]},
 {id:"12-2",t:"Una persona speciale",tfa:"یک آدم خاص",set:"مارکو از مادربزرگش می‌گوید.",
  lines:[
   ["A","Di chi è questa foto?","این عکس چه کسی است؟"],
   ["B","È mia nonna. È morta tre anni fa.","مادربزرگم است. سه سال پیش فوت کرد."],
   ["A","Com'era?","چه شکلی بود؟"],
   ["B","Era bassa e magra, con i capelli bianchi sempre raccolti.","کوتاه‌قد و لاغر بود، با موی سفیدی که همیشه بسته بود."],
   ["A","E di carattere?","از نظر شخصیت؟"],
   ["B","Era una donna forte. Non si lamentava mai e aiutava tutti.","زنی قوی بود. هیچ‌وقت شکایت نمی‌کرد و به همه کمک می‌کرد."],
   ["A","Ci vuole un carattere così per fare la nonna.","برای مادربزرگ بودن چنین شخصیتی لازم است."],
   ["B","Sì. Quando ero piccolo stavo sempre con lei: cucinava, mi raccontava le fiabe e mi portava al mercato.","بله. وقتی کوچک بودم همیشه با او بودم: غذا می‌پخت، برایم قصه می‌گفت و مرا به بازار می‌برد."]
  ]}
],
grammar:[
 {t:"Le espressioni di tempo con l’imperfetto",tfa:"عبارت‌های زمان با imperfetto",html:"<p>برای گفتن از عادت‌ها و صحنه‌های گذشته، imperfetto با این عبارت‌ها می‌آید:</p><ul><li><b class='it'>da bambino / da bambina</b> — در کودکی</li><li><b class='it'>quando avevo … anni</b> — وقتی ... ساله بودم</li><li><b class='it'>ogni estate / tutte le domeniche</b> — هر تابستان / همهٔ یکشنبه‌ها</li><li><b class='it'>allora / a quei tempi</b> — آن‌وقت‌ها / در آن دوران</li></ul><p>نکته: اگر لحظهٔ مشخصی در گذشته بیاید، فعل به <b>passato prossimo</b> می‌رود: <span class='it'>Quando avevo dieci anni, sono andato a Roma.</span></p>",
  table:{head:["عبارت","معنی","نمونه"],rows:[["da bambina","از کودکی (زن)","Da bambina abitavo in campagna."],["quando avevo otto anni","وقتی هشت‌ساله بودم","Quando avevo otto anni, giocavo sempre fuori."],["ogni domenica","هر یکشنبه","Ogni domenica andavamo dai nonni."],["a quei tempi","آن روزها","A quei tempi non c’erano i telefonini."],["allora","آن‌وقت","Allora la casa era più piccola."]]},
  egs:[["Da bambino giocavo a calcio ogni pomeriggio.","در کودکی هر بعدازظهر فوتبال بازی می‌کردم."],["Quando avevo sei anni, ho imparato a nuotare.","وقتی شش‌ساله بودم، شنا یاد گرفتم."],["A quei tempi la scuola cominciava alle otto.","آن روزها مدرسه ساعت هشت شروع می‌شد."]],
  note:"تفاوت مهم: <span class='it'>Da bambino andavo…</span> = عادت (imperfetto) / <span class='it'>Quel giorno sono andato…</span> = یک بار مشخص (passato prossimo)."},
 {t:"Il passato prossimo di cominciare e finire",tfa:"گذشتهٔ نقلی فعل‌های cominciare و finire",html:"<p>این دو فعل در گذشتهٔ نقلی با <b class='it'>avere</b> صرف می‌شوند:</p><ul><li><span class='it'>Ho cominciato un corso di italiano.</span> — یک دورهٔ ایتالیایی شروع کردم.</li><li><span class='it'>Ho finito i compiti.</span> — تکالیف را تمام کردم.</li></ul><p>وقتی فاعل «چیز» باشد و فعل لازم به کار رود، با <b class='it'>essere</b> می‌آید و اسم مفعول هماهنگ می‌شود: <span class='it'>Il film è cominciato alle otto. Le lezioni sono finite.</span></p>",
  table:{head:["شخص","cominciare","finire"],rows:[["io","ho cominciato","ho finito"],["tu","hai cominciato","hai finito"],["lui / lei","ha cominciato","ha finito"],["noi","abbiamo cominciato","abbiamo finito"],["voi","avete cominciato","avete finito"],["loro","hanno cominciato","hanno finito"]]},
  egs:[["Ho cominciato a lavorare nel 2019.","در ۲۰۱۹ شروع به کار کردم."],["Hai finito di studiare?","درست را تمام کردی؟"],["Il concerto è finito tardi.","کنسرت دیر تمام شد."]],
  note:"<b class='it'>cominciare a</b> و <b class='it'>finire di</b> حرف اضافهٔ ثابت دارند: <span class='it'>comincio a capire</span>، <span class='it'>finisco di mangiare</span>."},
 {t:"L'imperfetto",tfa:"زمان imperfetto (گذشتهٔ ناقص)",
  html:"<p>برای <b>عادت‌ها</b> و <b>توصیف</b> در گذشته به کار می‌رود؛ معادل فارسی «می‌رفتم، بود، داشت». </p><p>ساخت: ریشهٔ مصدر + پایانه. افعال <b>-are</b> پایانهٔ <b>-avo</b> می‌گیرند، بقیه <b>-evo/-ivo</b>.</p>",
  table:{head:["","-are (parlare)","-ere (prendere)","-ire (dormire)"],rows:[
   ["io","parlavo","prendevo","dormivo"],["tu","parlavi","prendevi","dormivi"],
   ["lui / lei","parlava","prendeva","dormiva"],["noi","parlavamo","prendevamo","dormivamo"],
   ["voi","parlavate","prendevate","dormivate"],["loro","parlavano","prendevano","dormivano"]]}},
 {t:"L'imperfetto di essere e dei verbi irregolari",tfa:"imperfetto فعل‌های بی‌قاعده",
  html:"<p>سه فعل بسیار پرکاربرد شکل بی‌قاعده دارند. بقیهٔ بی‌قاعده‌ها (dire، bere، tradurre) هم از همین الگو پیروی می‌کنند.</p>",
  table:{head:["","essere","fare","dire"],rows:[
   ["io","ero","facevo","dicevo"],["tu","eri","facevi","dicevi"],["lui / lei","era","faceva","diceva"],
   ["noi","eravamo","facevamo","dicevamo"],["voi","eravate","facevate","dicevate"],["loro","erano","facevano","dicevano"]]}},
 {t:"Passato prossimo o imperfetto?",tfa:"passato prossimo یا imperfetto؟",
  html:"<p><b>Passato prossimo</b> = عملی که <b>یک‌بار</b> تمام شد: <span class='it'>Ieri ho visto Marco</span>.</p><p><b>Imperfetto</b> = عادت، وضعیت، توصیف، یا کار <b>در جریان</b>: <span class='it'>Da piccolo vedevo Marco ogni giorno</span>.</p><p>در یک جملهٔ واحد معمولاً وضعیت با imperfetto و اتفاق با passato prossimo می‌آید: <span class='it'>Leggevo quando ha squillato il telefono</span>.</p>",
  table:{head:["con imperfetto","con altri tempi"],rows:[
   ["sempre, spesso, di solito","ieri, la settimana scorsa"],
   ["ogni giorno, ogni estate","una volta, due volte"],
   ["da bambino, a quei tempi","nel 2010, tre anni fa"],
   ["mentre, in quel momento","all'improvviso, poi, dopo"]]}},
 {t:"Il condizionale presente",tfa:"وجه شرطی حال",
  html:"<p>برای <b>درخواست مؤدبانه</b>، <b>پیشنهاد</b>، <b>نصیحت</b>، <b>آرزو</b> و <b>فرض</b>. معادل «می‌خواستم…، اگر…».</p><p>ساخت: مصدر + پایانه‌های <b>-ei, -esti, -ebbe, -emmo, -este, -ebbero</b>. افعال -are یک <b>e</b> اضافه می‌گیرند: <span class='it'>parlare → parlerei</span>.</p>",
  table:{head:["فعل","condizionale","معنی"],rows:[
   ["volere","vorrei","می‌خواستم"],["potere","potrei","می‌توانستم"],["dovere","dovrei","باید (می‌بایست)"],
   ["essere","sarei","می‌بودم"],["avere","avrei","می‌داشتم"],["fare","farei","می‌کردم"],
   ["andare","andrei","می‌رفتم"],["venire","verrei","می‌آمدم"],["sapere","saprei","می‌دانستم"]]}},
 {t:"Qualcuno e nessuno",tfa:"qualcuno و nessuno",
  html:"<p><b class='it'>Qualcuno</b> = کسی (در جملهٔ مثبت). <b class='it'>Nessuno</b> = هیچ‌کس؛ در ایتالیایی <b>دو</b> منفی به کار نمی‌رود، پس فعل مثبت می‌ماند: <span class='it'>Non c'è nessuno</span> (نه = نیست هیچ‌کس).</p><p>شکل صفتی: <span class='it'>qualche</span> + مفرد (<span class='it'>qualche volta</span>) و <span class='it'>nessun / nessuna</span> (<span class='it'>nessun problema</span>).</p>"},

 {t:"Né... né",tfa:"né… né (نه… نه)",

dialogs:[
 {id:"13-1",t:"Un tipo interessante",tfa:"یک آدم جالب",set:"الیزا و پائولو دربارهٔ همکار جدید حرف می‌زنند.",
  lines:[
   ["A","Hai conosciuto il nuovo collega?","با همکار جدید آشنا شدی؟"],
   ["B","Sì, è arrivato lunedì. Un tipo interessante davvero.","بله، دوشنبه آمد. واقعاً آدم جالبی است."],
   ["A","Com'è fisicamente?","از نظر ظاهر چه شکلی است؟"],
   ["B","Alto, magro, con i capelli mossi. Sembra un attore.","قدبلند، لاغر، با موی موج‌دار. شبیه بازیگرهاست."],
   ["A","E di carattere?","و از نظر شخصیت؟"],
   ["B","È riservato, ma molto simpatico quando prende confidenza. Direi sensibile e curioso.","کم‌حرف است، اما وقتی صمیمی شد خیلی خوش‌مشرب. می‌گویم حساس و کنجکاو."],
   ["A","Aspetta, non sarà mica il figlio della direttrice?","صبر کن، نکنه پسر مدیر است؟"],
   ["B","No, no. Però somiglia davvero a suo padre, che è un pittore famoso.","نه، نه. اما واقعاً شبیه پدرش است که نقاش معروفی است."],
   ["A","Interessante. Se fossi in te, ci prenderei un caffè, così lo conosci meglio.","جالب. اگر جای تو بودم با او یک قهوه می‌خوردم تا بهتر بشناسی‌اش."],
   ["B","Ci pensavo anch'io. Potremmo invitarlo venerdì.","من هم به همان فکر می‌کردم. می‌توانیم جمعه دعوتش کنیم."]
  ]},
 {id:"13-2",t:"Due fratelli",tfa:"دو برادر",set:"کارلا دربارهٔ دو برادرش می‌گوید.",
  lines:[
   ["A","Tu sei uguale a tua sorella, vero?","تو دقیقاً مثل خواهرت هستی، نه؟"],
   ["B","Mah, in realtà siamo molto diverse. Lei è estroversa, io piuttosto riservata.","خب، واقعاً خیلی متفاوتیم. او برون‌گراست، من نسبتاً درون‌گرا."],
   ["A","E fisicamente?","و از نظر ظاهری؟"],
   ["B","Lei è più alta di me e ha i capelli biondi, io li ho castani e corti.","او از من قدبلندتر است و موی بلوند دارد، من موی فندقی کوتاه."],
   ["A","Io invece assomiglio a mio fratello: stessa faccia, stesso carattere.","من برعکس شبیه برادرم هستم: همان صورت، همان شخصیت."],
   ["B","E andate d'accordo?","و با هم سازگارید؟"],
   ["A","Sì, ma litighiamo spesso. Siamo entrambi testardi.","بله، اما زیاد دعوا می‌کنیم. هر دو لجبازیم."]
  ]}
],

grammar:[
 {t:"Volere all'imperfetto",tfa:"volere در گذشتهٔ ناقص",
  html:"<p><b class='it'>Volevo…</b> درخواست را نرم می‌کند: <span class='it'>Volevo chiederti una cosa</span> = «می‌خواستم چیزی بپرسم» (نه اینکه واقعاً در گذشته خواسته باشم).</p><p>همان کار را <span class='it'>vorrei</span> (condizionale) هم می‌کند؛ <span class='it'>volevo</span> صمیمی‌تر و محاوره‌ای‌تر است.</p>",
  table:{head:["شکل","کاربرد"],rows:[
   ["voglio","مستقیم و قاطع"],["vorrei","مؤدب، استاندارد"],["volevo","مؤدب، محاوره‌ای"]]}},
 {t:"Sapere e conoscere al passato prossimo",tfa:"sapere و conoscere در گذشته",
  html:"<p>این دو فعل با تغییر زمان، <b>معنی</b> عوض می‌کنند:</p><p><b class='it'>ho saputo</b> = خبردار شدم (اطلاعات تازه). <b class='it'>sapevo</b> = می‌دانستم (از قبل).</p><p><b class='it'>ho conosciuto</b> = آشنا شدم (اولین برخورد). <b class='it'>conoscevo</b> = می‌شناختم (از قبل).</p>",
  table:{head:["جمله","معنی"],rows:[
   ["Ho saputo che ti sposi!","خبردار شدم که ازدواج می‌کنی!"],
   ["Sapevo già la notizia.","از قبل خبر را می‌دانستم."],
   ["Ho conosciuto Marco nel 2019.","مارکو را در ۲۰۱۹ شناختم."],
   ["Conoscevo Marco da anni.","سال‌ها بود مارکو را می‌شناختم."]]}},
 {t:"Stare + gerundio",tfa:"stare + gerundio (در حال …)",
  html:"<p>برای کاری که <b>همین حالا در جریان</b> است: <span class='it'>sto leggendo</span> = دارم می‌خوانم.</p><p>ساختار: stare + gerundio (فعل + <b>-ando</b> برای -are، <b>-endo</b> برای -ere/-ire).</p><p>در ایتالیایی این ساختار کمتر از فارسی استفاده می‌شود؛ حال ساده معمولاً کافی است. <span class='it'>Leggo</span> هم «می‌خوانم» است و هم «دارم می‌خوانم».</p>",
  table:{head:["فعل","gerundio","مثال"],rows:[
   ["parlare","parlando","Sto parlando."],["prendere","prendendo","Sto prendendo."],
   ["dormire","dormendo","Sto dormendo."],["fare","facendo","Sto facendo."],["essere","essendo","Essendo stanco, resto."]]}},
 {t:"I pronomi diretti e ce l'ho",tfa:"ضمیر مفعولی مستقیم و ce l'ho",
  html:"<p>ضمیر مفعولی مستقیم: <span class='it'>mi, ti, lo, la, ci, vi, li, le</span>.</p><p><b class='it'>Avere</b> با این ضمیرها شکل <b>ce l'ho</b> می‌گیرد: <span class='it'>Hai il libro? — Sì, ce l'ho</span>. برای جمع: <span class='it'>ce li ho</span>، <span class='it'>ce le ho</span>.</p>",
  table:{head:["سؤال","پاسخ مثبت","پاسخ منفی"],rows:[
   ["Hai la penna?","Sì, ce l'ho.","No, non ce l'ho."],
   ["Hai i biglietti?","Sì, ce li ho.","No, non ce li ho."],
   ["Hai le chiavi?","Sì, ce le ho.","No, non ce le ho."]]}},
 {t:"La concordanza del participio",tfa:"مطابقت اسم مفعول با ضمیر مفعولی",
  html:"<p>وقتی ضمیر مفعولی مستقیم (lo, la, li, le) قبل از فعل بیاید، اسم مفعول <b>با آن مطابقت</b> می‌کند:</p><p><span class='it'>Hai visto i film? — Sì, li ho visti.</span></p><p><span class='it'>Hai comprato la gonna? — Sì, l'ho comprata.</span></p><p>بدون ضمیر، مفعول مطابقت ندارد: <span class='it'>Ho visto i film</span>.</p>"},
 {t:"La posizione dei pronomi con l'infinito",tfa:"جای ضمیر با مصدر",
  html:"<p>با مصدر، ضمیر <b>به آخر مصدر می‌چسبد</b>: <span class='it'>Posso provarlo?</span>، <span class='it'>Voglio vederla</span>.</p><p>با فعل صرف‌شده (potere, volere, dovere) هر دو جایز است: <span class='it'>Lo posso provare</span> = <span class='it'>Posso provarlo</span>.</p>"},
 {t:"Già e non... ancora",tfa:"già و non… ancora",
  html:"<p><b class='it'>già</b> = قبلاً، از قبل: <span class='it'>Ho già mangiato</span> (قبلاً خورده‌ام).</p><p><b>non… ancora</b> = هنوز نه: <span class='it'>Non ho ancora mangiato</span> (هنوز نخورده‌ام).</p><p>هر دو معمولاً بین فعل کمکی و اسم مفعول می‌آیند.</p>"},
 {t:"I pronomi relativi che e cui",tfa:"ضمیرهای موصولی che و cui",
  html:"<p><b class='it'>che</b> = که (فاعل یا مفعول): <span class='it'>Il ragazzo che parla è mio fratello</span>.</p><p><b class='it'>cui</b> بعد از حرف اضافه: <span class='it'>La casa in cui abito</span>، <span class='it'>La persona a cui ho scritto</span>، <span class='it'>Il libro di cui parlavamo</span>.</p><p>در فارسی هر دو «که» می‌شوند؛ تفاوت در حرف اضافه است.</p>"}
],

culture:{t:"Caffè culturale 5 — Viaggiare in Italia",fa:"فرهنگ: سفر در ایتالیا",
 html:"<p>سفر با قطار در ایتالیا راحت و پرکاربرد است. دو نوع اصلی: <b class='it'>Regionale</b> (کندتر و ارزان، توقف در همهٔ ایستگاه‌ها) و <b class='it'>Frecciarossa / Italo</b> (سریع‌السیر بین شهرهای بزرگ).</p><p>نکتهٔ مهم: بلیت قطارهای منطقه‌ای را قبل از سوار شدن باید <b class='it'>convalidare</b> کنی — در دستگاه کوچک روی سکو مهر بزنی. اگر مهر نزنی، جریمه می‌شوی، حتی با بلیت معتبر.</p><p>در هتل‌ها <b class='it'>la tassa di soggiorno</b> (عوارض اقامت) جدا از قیمت اتاق است و معمولاً نقدی هنگام خروج گرفته می‌شود.</p><p>و یک عبارت که همه‌جا می‌شنوی: <span class='it'>Mi scusi</span> — برای جلب توجه، عذرخواهی و رد شدن از میان جمعیت.</p>"}

dialogs:[
 {id:"16-1",t:"Un consiglio in cucina",tfa:"یک نصیحت در آشپزخانه",set:"پائولا به دوستش یاد می‌دهد چطور پستو درست کند.",
  lines:[
   ["A","Allora, cosa devo mettere per il pesto?","خب، برای پستو چه باید بریزم؟"],
   ["B","Prendi il basilico fresco e mettilo nel frullatore.","ریحان تازه را بردار و در غذاساز بریز."],
   ["A","Quanto basilico?","چقدر ریحان؟"],
   ["B","Un bel mazzetto, e non mettere troppo sale.","یک دستهٔ خوب، و نمک زیاد نریز."],
   ["A","E i pinoli?","و دانه‌های کاج؟"],
   ["B","Sì, una manciata. Aggiungi anche l'aglio, ma poco: uno spicchio.","بله، یک مشت. سیر هم اضافه کن، اما کم: یک حبه."],
   ["A","Olio quanto ne metto?","روغن چقدر بریزم؟"],
   ["B","Versalo piano piano e mescola sempre. Quello che conta è la qualità dell'olio.","آرام‌آرام بریز و مدام هم بزن. آنچه مهم است کیفیت روغن است."],
   ["A","Assaggia tu, io non sono sicura.","تو بچش، من مطمئن نیستم."],
   ["B","Mmm, buonissimo! Manca solo un po' di sale.","هوم، خیلی خوشمزه! فقط کمی نمک کم دارد."]
  ]},
 {id:"16-2",t:"Al ristorante",tfa:"در رستوران",set:"دو گردشگر در رستوران سفارش می‌دهند.",
  lines:[
   ["A","Buonasera, avete un tavolo per due?","شب بخیر، میز دونفره دارید؟"],
   ["B","Certo, prego. Ecco il menù.","البته، بفرمایید. این منو."],
   ["A","Che cosa mi consiglia?","چه چیزی پیشنهاد می‌کنید؟"],
   ["B","Oggi c'è la pasta al pomodoro fresca, ottima. Oppure il pesce del giorno.","امروز پاستا با گوجهٔ تازه داریم، عالی. یا ماهی روز."],
   ["A","Per me la pasta. E da bere?","برای من پاستا. و برای نوشیدن؟"],
   ["B","Abbiamo un vino bianco della casa molto buono.","یک شراب سفید خانگی خیلی خوب داریم."],
   ["A","Va bene. E per lei, signora?","باشه. و برای شما خانم؟"],
   ["C","Vorrei un'insalata mista, senza sale per favore.","سالاد مخلوط می‌خواهم، بدون نمک لطفاً."],
   ["B","Certamente. Il conto lo porto alla fine.","حتماً. صورتحساب را آخر می‌آورم."]
  ]}
],
grammar:[
 {t:"Quello che",tfa:"quello che (آنچه / چیزی که)",
  html:"<p><b class='it'>quello che</b> = «آنچه» و به‌جای اسمی می‌آید که نمی‌خواهی تکرارش کنی:</p><p><span class='it'>Quello che mi piace è la cucina italiana</span> = آنچه دوست دارم آشپزی ایتالیایی است.</p><p>در جملهٔ پرسشی: <span class='it'>Non capisco quello che dici</span> = نمی‌فهمم چه می‌گویی.</p><p>برای جمع: <span class='it'>quelli che</span>.</p>"},
 {t:"L'imperativo irregolare (tu)",tfa:"وجه امری بی‌قاعده (tu)",
  html:"<p>چند فعل پرکاربرد شکل کوتاه دارند:</p>",
  table:{head:["فعل","امری tu","منفی"],rows:[
   ["essere","sii!","non essere!"],["avere","abbi!","non avere!"],
   ["andare","va'!","non andare!"],["fare","fa'!","non fare!"],
   ["dare","da'!","non dare!"],["stare","sta'!","non stare!"],
   ["sapere","sappi!","non sapere!"],["dire","di'!","non dire!"],
   ["tenere","tieni!","non tenere!"],["venire","vieni!","non venire!"]]}},
 {t:"L'imperativo negativo (tu)",tfa:"وجه امری منفی (tu)",
  html:"<p>برای همهٔ فعل‌ها یک قاعده: <b>non + مصدر</b>. تنها استثناها فعل‌های بالا هستند که شکل کوتاه دارند (<span class='it'>non essere, non avere, non fare…</span>).</p><p><span class='it'>Non mangiare troppo!</span> — <span class='it'>Non andare via!</span></p><p>در ایتالیایی <b>بدون</b> تغییر فعل عمل می‌کند، برخلاف مثبت که شکل امری می‌گیرد.</p>"},
 {t:"La posizione del pronome con l'imperativo (tu)",tfa:"جای ضمیر با وجه امری (tu)",
  html:"<p>با امری <b>مثبت</b>، ضمیر <b>به فعل می‌چسبد</b>: <span class='it'>Prendi il libro → Prendilo</span>. با امری <b>منفی</b>، ضمیر <b>جدا</b> و قبل از فعل می‌آید: <span class='it'>Non lo prendere</span>.</p><p>با فعل‌های تک‌سیلابی کوتاه (da', fa', sta', va', di') صامت اول ضمیر دو برابر می‌شود: <span class='it'>dammi</span>، <span class='it'>fallo</span>، <span class='it'>stai zitto</span>، <span class='it'>vacce</span>.</p>",
  table:{head:["مثبت","منفی"],rows:[
   ["Prendilo!","Non lo prendere!"],["Mangialo!","Non lo mangiare!"],
   ["Dammi una mano!","Non mi dare retta!"],["Fallo tu!","Non farlo!"]]}},
 {t:"Il verbo servire",tfa:"فعل servire (لازم بودن)",
  html:"<p><b class='it'>servire</b> = لازم بودن. با مفرد <span class='it'>serve</span>، با جمع <span class='it'>servono</span>:</p><p><span class='it'>Mi serve una penna</span> (یک خودکار لازم دارم). <span class='it'>Mi servono due uova</span> (دو تخم‌مرغ لازم دارم).</p><p>برخلاف فارسی، در این ساختار شخص ضمیر غیرفاعلی است و <b>چیز لازم</b> فاعل.</p>",
  table:{head:["جمله","معنی"],rows:[

culture:{t:"Caffè culturale 6 — A tavola",fa:"فرهنگ: سر سفرهٔ ایتالیایی",
 html:"<p>غذای اصلی ایتالیایی‌ها <b class='it'>il pranzo</b> است، نه شام. شام معمولاً دیر (حدود ۲۰ تا ۲۱) و سبک‌تر است.</p><p>ساختار یک شام کامل: <span class='it'>antipasto</span> (پیش‌غذا)، <span class='it'>primo</span> (پاستا یا برنج)، <span class='it'>secondo</span> (گوشت یا ماهی)، <span class='it'>contorno</span> (سبزیجات) و <span class='it'>dolce</span>. در زندگی روزمره، خیلی‌ها فقط primo یا فقط secondo می‌خورند.</p><p><b class='it'>al dente</b> یعنی پاستا نه زیاد نرم و نه سفت — کمی زیر دندان مقاوم. در ایتالیا پاستای خیلی نرم نشانهٔ بد پختن است.</p><p>یک نکتهٔ کاربردی: در رستوران <b class='it'>il coperto</b> (هزینهٔ نشستن و نان) به‌طور خودکار به صورتحساب اضافه می‌شود؛ انعام اجباری نیست، اما گرد کردن مبلغ رسم است.</p>"}
