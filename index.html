dialogs:[
 {id:"17-1",t:"Dal medico",tfa:"پیش پزشک",set:"آنا به‌خاطر گلودرد و تب به پزشک مراجعه می‌کند.",
  lines:[
   ["A","Buongiorno, si accomodi. Che cosa ha?","سلام، بفرمایید بنشینید. چه شده؟"],
   ["B","Dottore, sto male da tre giorni: ho mal di gola e la febbre.","دکتر، سه روز است حالم خوب نیست: گلودرد دارم و تب."],
   ["A","Quanta febbre ha?","چقدر تب دارید؟"],
   ["B","Ieri sera trentotto e mezzo.","دیشب سی‌وهشت‌ونیم."],
   ["A","Apra la bocca, prego. … Sì, la gola è molto arrossata. Ha anche la tosse?","دهانتان را باز کنید. … بله، گلو خیلی قرمز است. سرفه هم دارید؟"],
   ["B","Un po', la notte soprattutto.","کمی، بیشتر شب‌ها."],
   ["A","Non è niente di grave, è un'influenza. Le prescrivo uno sciroppo.","چیز جدی نیست، آنفلوانزاست. یک شربت تجویز می‌کنم."],
   ["B","Come devo prenderlo?","چطور باید مصرفش کنم؟"],
   ["A","Un cucchiaio tre volte al giorno, dopo i pasti. E si riposi: non vada al lavoro per due giorni.","یک قاشق سه بار در روز، بعد از غذا. و استراحت کنید: دو روز سر کار نروید."],
   ["B","Va bene, grazie dottore.","باشه، ممنون دکتر."]
  ]},
 {id:"17-2",t:"In palestra",tfa:"در باشگاه",set:"داویده دوستش را تشویق می‌کند ورزش را شروع کند.",
  lines:[
   ["A","Non ti vedo mai in forma. Perché non vieni in palestra con me?","هیچ‌وقت سرحال نمی‌بینمت. چرا با من به باشگاه نمی‌آیی؟"],
   ["B","Mah, non ho tempo e poi mi annoio.","خب، وقت ندارم و بعد هم حوصله‌ام سر می‌رود."],
   ["A","Guarda, potresti cominciare con due volte a settimana, solo un'ora.","ببین، می‌توانی با دو بار در هفته شروع کنی، فقط یک ساعت."],
   ["B","Lo so che hai ragione, ma non so da dove iniziare.","می‌دانم که حق داری، اما نمی‌دانم از کجا شروع کنم."],
   ["A","Vieni con me lunedì: ti faccio vedere gli attrezzi e proviamo insieme.","دوشنبه با من بیا: دستگاه‌ها را نشانت می‌دهم و با هم امتحان می‌کنیم."],
   ["B","E se poi mi fa male tutto?","و اگر بعدش همهٔ بدنم درد بگیرد؟"],
   ["A","All'inizio è normale. Comincia piano, non esagerare.","اولش طبیعی است. آرام شروع کن، زیاده‌روی نکن."],
   ["B","Va bene, dai. Ma se mi annoio, smetto.","باشه، بیا. اما اگر حوصله‌ام سر رفت، رهایش می‌کنم."],
   ["A","Scommetto che dopo un mese non smetti più.","شرط می‌بندم بعد از یک ماه دیگر رهایش نکنی."]
  ]}
],

  lines:[
   ["A","Buongiorno, si accomodi. Mi parli un po' di lei.","سلام، بفرمایید. کمی از خودتان بگویید."],
   ["B","Mi chiamo Elena Rossi, ho venticinque anni e mi sono laureata in lingue.","نام من النا روسی است، بیست‌وپنج سال دارم و در زبان‌ها فارغ‌التحصیل شدم."],
   ["A","Che lingue parla?","چه زبان‌هایی صحبت می‌کنید؟"],
   ["B","Parlo inglese e spagnolo, e studio il tedesco da un anno.","انگلیسی و اسپانیایی صحبت می‌کنم و یک سال است آلمانی می‌خوانم."],
   ["A","Ha già esperienza nel settore?","در این حوزه تجربه دارید؟"],
   ["B","Sì, ho fatto uno stage di sei mesi in un albergo.","بله، شش ماه کارآموزی در یک هتل انجام دادم."],
   ["A","Bene. Se la assumiamo, dovrà lavorare anche il sabato. Va bene?","خوب. اگر استخدامتان کنیم، باید شنبه‌ها هم کار کنید. اشکالی ندارد؟"],
   ["B","Certo, non è un problema.","البته، مشکلی نیست."],
   ["A","Quando potrebbe cominciare?","چه زمانی می‌توانید شروع کنید؟"],

   ["C","Lì per lì no. Però dopo due settimane stavo per partire per lavoro e mi sono accorta che non volevo andare senza di lui.","همان لحظه نه. اما دو هفته بعد داشتم برای کار می‌رفتم و فهمیدم که نمی‌خواهم بدون او بروم."],
   ["B","Io l'ho saputo subito. È stato un colpo di fulmine.","من از همان اول فهمیدم. عشق در یک نگاه بود."]
  ]},
 {id:"19-2",t:"Un imprevisto",tfa:"یک پیش‌آمد پیش‌بینی‌نشده",set:"سارا به دوستش توضیح می‌دهد چرا دیروز به مهمانی نرسید.",
  lines:[
   ["A","Ieri ti ho aspettato tutta la sera! Che è successo?","دیروز تمام شب منتظرت بودم! چه شد؟"],
   ["B","Scusa, non sono potuta venire. Stavo per uscire quando mia madre mi ha chiamato: mio nonno non stava bene.","ببخشید، نتوانستم بیایم. داشتم بیرون می‌رفتم که مادرم زنگ زد: پدربزرگم خوب نبود."],
   ["A","Oh, mi dispiace. Adesso sta meglio?","آه، متأسفم. الان بهتر است؟"],
   ["B","Sì, grazie. Siamo dovuti andare in ospedale e siamo rimasti lì fino a mezzanotte.","بله، ممنون. مجبور شدیم به بیمارستان برویم و تا نیمه‌شب آنجا ماندیم."],
   ["A","Menomale che non era grave.","خدا را شکر که جدی نبود."],
   ["B","Appena è uscito dall'ospedale, l'ho portato a casa mia. Adesso sta per tornare a casa sua, si sente bene.","به محض اینکه از بیمارستان مرخص شد، او را به خانهٔ خودم بردم. الان همین حالا دارد به خانهٔ خودش برمی‌گردد، حالش خوب است."],
   ["A","Però potevi mandarmi un messaggio!","اما می‌توانستی یک پیام بفرستی!"],
   ["B","Hai ragione, volevo scriverti però il telefono era scarico. Scusa davvero.","حق داری، می‌خواستم بنویسم ولی تلفنم شارژ نداشت. واقعاً ببخشید."],
   ["A","Dai, non importa. Facciamo un'altra volta.","بی‌خیال، مهم نیست. یک بار دیگر می‌کنیم."]
  ]}

grammar:[
 {t:"Mentre e durante",tfa:"mentre و durante",
  html:"<p><b class='it'>mentre</b> حرف ربط است و با یک <b>جملهٔ کامل</b> (فعل صرف‌شده) می‌آید.</p><p><b class='it'>durante</b> حرف اضافه است و با یک <b>اسم</b> می‌آید.</p><p>هر دو «هم‌زمانی» می‌رسانند، اما ساختار جمله فرق می‌کند.</p>",
  table:{head:["جمله","معنی"],rows:[
   ["Mentre leggevo, ascoltavo musica.","در حالی که می‌خواندم، موسیقی گوش می‌دادم."],
   ["Durante la lezione ho preso appunti.","در طول درس یادداشت برداشتم."],
   ["Mentre cenavamo è arrivato Luca.","در حالی که شام می‌خوردیم لوکا رسید."],
   ["Durante la cena è arrivato Luca.","در طول شام لوکا رسید."]]}},
 {t:"Stare per + infinito",tfa:"stare per + مصدر",
  html:"<p>بیان می‌کند کاری <b>همین حالا</b> یا <b>در همان لحظهٔ گذشته</b> در شرف رخ دادن بود.</p><p>فرمول: <b class='it'>stare</b> (حال یا گذشته) + <b>per</b> + مصدر. معنای فارسی: «همین حالا می‌خواستم…» / «داشتم…».</p>",
  table:{head:["جمله","معنی"],rows:[
   ["Sto per uscire.","همین حالا می‌خواهم بیرون بروم."],
   ["Sta per piovere.","می‌خواهد باران بگیرد."],
   ["Stavo per telefonarti!","همین حالا داشتم به تو زنگ می‌زدم!"],
   ["Stavano per partire quando è squillato il telefono.","داشتند حرکت می‌کردند که تلفن زنگ زد."]]}},
 {t:"Il passato prossimo dei modali",tfa:"گذشتهٔ دور فعل‌های کمکی",
  html:"<p><b class='it'>potere, dovere, volere</b> در گذشته معمولاً با <b>avere</b> صرف می‌شوند و شکل فعل اصلی بعد از آن‌ها <b>ثابت می‌ماند</b> (مصدر یا ماضی نقلی).</p><p><span class='it'>ho potuto / non ho potuto</span> — <span class='it'>ho dovuto</span> — <span class='it'>ho voluto</span>.</p><p>با <b>افعال حرکتی و بی‌شخص</b> (andare, venire, partire, arrivare) هر دو حالت ممکن است: <span class='it'>non sono potuto venire</span> / <span class='it'>non ho potuto venire</span>.</p><p>نکتهٔ معنا: <b class='it'>non ho potuto</b> = «نتوانستم در آن لحظه»؛ <b class='it'>non potevo</b> = «نمی‌توانستم، به‌طور کلی».</p>",
  table:{head:["جمله","معنی"],rows:[
   ["Non sono potuto venire.","نتوانستم بیایم."],
   ["Ho dovuto lavorare tutto il giorno.","مجبور شدم تمام روز کار کنم."],
   ["Non ha voluto rispondere.","نخواست جواب بدهد."],
   ["Abbiamo dovuto aspettare due ore.","مجبور شدیم دو ساعت صبر کنیم."]]}},
 {t:"I connettivi: però, quindi, perché",tfa:"حروف ربط",
  html:"<p><b class='it'>però</b> = اما (مخالفت). مترادف محاوره‌ای <b class='it'>ma</b>، اما <b class='it'>però</b> بیشتر در وسط جمله و با کمی تأکید.</p><p><b class='it'>quindi</b> = بنابراین (نتیجه).</p><p><b class='it'>perché</b> = چون / چرا (دلیل). در سؤال «چرا؟»، در جواب «چون».</p><p><b class='it'>siccome</b> = چون، اما جمله باید با آن شروع شود و بعد ویرگول بیاید.</p>",
  table:{head:["اتصال","مثال"],rows:[
   ["però","Era tardi, però sono andato lo stesso."],
   ["quindi","Pioveva, quindi sono rimasto a casa."],
   ["perché","Non sono venuto perché stavo male."],
   ["siccome","Siccome pioveva, sono rimasto a casa."]]}}
],

culture:{t:"Caffè culturale 9 — L'amore all'italiana",fa:"فرهنگ: عشق ایتالیایی",
 html:"<p>اصطلاح <b class='it'>colpo di fulmine</b> («ضربهٔ آذرخش») معادل دقیق «عشق در یک نگاه» است — و ایتالیایی‌ها آن را زیاد به کار می‌برند.</p><p>در ایتالیا، <b class='it'>San Valentino</b> (۱۴ فوریه) یک مناسبت کوچک است؛ مهم‌تر <b class='it'>la festa della donna</b> (۸ مارس) است که مردها به زن‌ها <b class='it'>mimosa</b> (گل زرد کوچک) هدیه می‌دهند.</p><p>اصطلاح زیبای دیگری هم هست: <span class='it'>essere in crisi</span> («در بحران بودن») یعنی رابطه‌ات دارد به هم می‌خورد — خیلی محاوره‌ای است.</p><p>و یک چیز فرهنگی: در ایتالیا <b class='it'>fare il primo passo</b> (قدم اول را برداشتن) بیشتر از مرد انتظار می‌رود، اما در محافل جوان شهری این قاعده دارد نرم می‌شود.</p>"}

phrases:[
 {w:"Ho bisogno di una casa più grande, ma il centro costa troppo.",fa:"به خانهٔ بزرگ‌تری نیاز دارم، اما مرکز شهر خیلی گران است."},
 {w:"Mi piacerebbe un terrazzo, però mi accontento del balcone.",fa:"دلم یک تراس می‌خواهد، ولی به بالکن قناعت می‌کنم."},
 {w:"A favore di questa zona ci sono i negozi; contro, il traffico.",fa:"موافق این محله مغازه‌هاست؛ مخالفش، ترافیک."},
 {w:"Da una parte vorrei la campagna, dall’altra non voglio stare lontano dagli amici.",fa:"از یک طرف روستا را می‌خواهم، از طرف دیگر نمی‌خواهم از دوستانم دور باشم."},
 {w:"Magari avessi una casa così!",fa:"ای کاش چنین خانه‌ای داشتم!"},
 {w:"Spero che tu venga alla festa.",fa:"امیدوارم به مهمانی بیایی."},
 {w:"Penso che sia una buona idea.",fa:"فکر می‌کنم ایدهٔ خوبی است."},
 {w:"Voglio che tu veda questa casa.",fa:"می‌خواهم این خانه را ببینی."},

 {w:"Cerco un appartamento più grande di questo.",fa:"آپارتمانی بزرگ‌تر از این می‌خواهم."},

dialogs:[
 {id:"20-1",t:"In cerca di casa",tfa:"در جست‌وجوی خانه",set:"فرانچسکا یک آپارتمان را بازدید می‌کند.",
  lines:[
   ["A","Buongiorno, è lei che cerca un bilocale?","سلام، شما هستید که دنبال واحد دو‌اتاقه هستید؟"],
   ["B","Sì, esatto. L'annuncio dice che è al terzo piano con ascensore.","بله، دقیقاً. در آگهی نوشته طبقهٔ سوم با آسانسور."],
   ["A","Sì. È luminoso e anche abbastanza spazioso. Prego, entri.","بله. نورگیر است و به‌اندازهٔ کافی جادار هم هست. بفرمایید، داخل شوید."],
   ["B","Che bello! E che bel balcone.","چه قشنگ! و چه بالکن قشنگی."],
   ["A","Dal balcone si vede tutta la città. È molto tranquillo, perché siamo in una via interna.","از بالکن تمام شهر دیده می‌شود. خیلی آرام است، چون در کوچه‌ای داخلی هستیم."],
   ["B","Quanto costa l'affitto?","اجاره‌اش چقدر است؟"],
   ["A","Settecento euro al mese, spese del condominio escluse.","هفتصد یورو در ماه، بدون هزینه‌های ساختمان."],
   ["B","È un po' caro. Sinceramente speravo in qualcosa di meno.","کمی گران است. صادقانه امید داشتم کمتر باشد."],
   ["A","Capisco. Però pensi che è arredato e che la cucina è nuova.","می‌فهمم. اما در نظر بگیرید که مبله است و آشپزخانه نو است."],
   ["B","È vero. Magari ne parlo con mio marito e le faccio sapere domani.","درست است. شاید با شوهرم صحبت کنم و فردا به شما خبر بدهم."],
   ["A","Va bene. Però le consiglio di decidere presto: ci sono altre persone interessate.","باشد. اما توصیه می‌کنم زود تصمیم بگیرید: افراد دیگری هم علاقه‌مندند."]
  ]},
 {id:"20-2",t:"La casa dei sogni",tfa:"خانهٔ رویایی",set:"دو دوست دربارهٔ خانه‌ای که آرزو دارند حرف می‌زنند.",
  lines:[
   ["A","Se potessi scegliere, che casa vorresti?","اگر می‌توانستی انتخاب کنی، چه خانه‌ای می‌خواستی؟"],
   ["B","Una casa in campagna, con un grande giardino. Magari vicino al mare.","خانه‌ای در روستا، با باغچهٔ بزرگ. شاید نزدیک دریا."],
   ["A","Io invece preferisco la città. Voglio che ci siano negozi, cinema, tutto vicino.","من در عوض شهر را ترجیح می‌دهم. می‌خواهم مغازه و سینما و همه‌چیز نزدیک باشد."],

<script>
/* ============================================================
   Espresso A1 — unlimited sentence builder
   Generates a fresh, grammatical sentence every time by combining
   a lesson frame with typed pools. Agreement is resolved from the
   data (person / gender / number / preposition), never guessed.
   ============================================================ */
(function () {
  'use strict';

  function pick(a, rnd) { return a[Math.floor(rnd() * a.length)]; }

  /* mulberry32 — deterministic per seed so a sentence can be reproduced/shared */
  function rng(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  var VERB_ALIAS = {
    avere_obj: 'avere',
    andare_city: 'andare',
    andare_country: 'andare'
  };

  function verbTable(S, name) {
    if (VERB_ALIAS[name]) name = VERB_ALIAS[name];
    if (name === 'essere') return S.essere;
    if (name === 'avere') return S.avere;
    if (name === 'andare') return S.andare;
    return S.verbs[name];
  }

  /* Build one sentence. Returns {it, fa, tokens, note, frame, seed}. */
  function generate(lessonId, seed) {
    var S = window.ESPRESSO.sentences;
    var frames = S.lessons[lessonId] || S.lessons[1];
    var rnd = rng(seed);
    var f = pick(frames, rnd);
    var subj = pick(S.subj, rnd);
    var p = subj.p;
    var gn = pick(subj.gn, rnd);

    var map = { S: subj.it, S_FA: subj.fa };
    var ess = S.essere;
    map.ESS = ess.it[p];
    map.ESS_FA = ess.fa[p];

    /* family frames: the member itself carries person + gender */
    var fam = null;
    if (f.fam) {
      fam = pick(S.pools.family, rnd);
      p = fam.p;
      gn = fam.gn;
      map.FAM = fam.it; map.FAM_FA = fam.fa;
      map.FESS = S.essere.it[p]; map.FESS_FA = S.essere.fa[p];
    }
    if (f.third) { p = 2; }
    if (f.sixth) { p = 5; }

    if (f.v) {
      var vt = verbTable(S, f.v);
      map.V = vt.it[p];
      map.V_FA = vt.fa[p];
      map.VF = vt.it[p]; map.VF_FA = vt.fa[p];
      map.V3 = vt.it[2]; map.V3_FA = vt.fa[2];
      map.V6 = vt.it[5]; map.V6_FA = vt.fa[5];
    }
    if (f.famadj) {
      var fadj = pick(S.adj, rnd);
      map.FA = fadj.forms[gn];
      map.FA_FA = fadj.fa;
    }

    /* adjective agreement */
    if (f.adj) {
      var a = pick(S.adj, rnd);
      map.A = a.forms[gn];
      map.A_FA = a.fa;
    }
    if (f.roomadj) {
      var ra = pick(S.adj, rnd);
      map.ADJ_F = ra.forms[1];   /* camera is feminine singular */
      map.A_FA = ra.fa;
    }
    if (f.fixed === 'intro') {
      var n = pick(S.nazionalita, rnd);
      map.NAT = n.forms[gn];
      map.NAT_FA = n.fa;
    }

    /* object pools */
    function put(poolName, token) {
      var pool = S.pools[poolName];
      if (!pool) return null;
      var v = pick(pool, rnd);
      map[token] = v.it;
      map[token + '_FA'] = v.fa;
      return v;
    }
    var POOL_TOKEN = {
      food: 'O', drink: 'O', thing: 'O', reading: 'O', watch: 'O', listen: 'O',
      study: 'O', language: 'LANG', city: 'CITY', country: 'COUNTRY',
      venue: 'VENUE', room: 'O', sight: 'O'
    };
    if (f.o) {
      var tok = POOL_TOKEN[f.o] || 'O';
      put(f.o, tok);
      /* frames that name the object slot explicitly */
      if (f.polite) put(f.polite, 'O');
    }
    if (f.o2) {
      var pool2 = S.pools[f.o2];
      var v2 = pick(pool2, rnd);
      /* avoid "parlo italiano e italiano" */
      var guard = 0;
      while (v2.it === map.LANG && guard++ < 8) v2 = pick(pool2, rnd);
      map.LANG2 = v2.it; map.LANG2_FA = v2.fa;
    }
    if (f.t) put(f.t, 'TIME');
    if (f.polite && !f.o) put(f.polite, 'O');
    if (f.like) put(f.like, 'ACT');
    if (f.familylike) { put(f.familylike, 'ACT'); map.LIKE = 'ci piace'; }
    if (f.cost) put(f.cost, 'O');
    if (f.there) { put('city', 'CITY'); put('sight', 'SIGHT'); }

    function fill(tpl) {
      return tpl.replace(/\{([A-Z0-9_]+)\}/g, function (_, k) {
        return map[k] !== undefined ? map[k] : '';
      }).replace(/\s+/g, ' ').replace(/\s+([,.?!])/g, '$1').trim();
    }

    var it = fill(f.it);
    var fa = fill(f.fa);
    /* Italian subject pronouns are capitalised only at the sentence start.
       Templates like "{TIME}, {S} {V} {O}" put the subject mid-sentence. */
    it = it.replace(/\b(Io|Tu|Lui|Lei|Noi|Voi|Loro)\b/g, function (m, _g, off) {
      return off === 0 ? m : m.toLowerCase();
    });
    /* family frames start mid-template, so capitalise the sentence start */
    it = it.charAt(0).toUpperCase() + it.slice(1);

    /* tokenise on spaces but keep elisions (un’amica, c’è, d’acqua) intact */
    var tokens = it.replace(/([,.?!])$/, '').split(/\s+/).filter(Boolean);

    return {
      it: it, fa: fa, tokens: tokens, note: f.note || '',
      seed: seed, lesson: lessonId,
      words: tokens.length
    };
  }

  /* A cheap uniqueness guard so "unlimited" does not immediately repeat. */
  function makeSession(lessonId) {
    var seen = {};
    var n = 0;
    return {
      lesson: lessonId,
      next: function () {
        var s, tries = 0;
        do {
          s = generate(lessonId, (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
          tries++;
        } while (seen[s.it] && tries < 40);
        seen[s.it] = 1;
        n++;
        /* bound memory on very long sessions */
        if (n % 300 === 0) seen = {};
        return s;
      },
      count: function () { return n; }
    };
  }

  /* how many distinct sentences a lesson can produce (for the UI) */
  function variety(lessonId) {
    var S = window.ESPRESSO.sentences;
    var frames = S.lessons[lessonId] || [];
    var total = 0;
    frames.forEach(function (f) {
      var n = 1;
      if (f.fam) n *= S.pools.family.length;
      else if (!f.third && !f.sixth && !f.polite && !f.like && !f.familylike && !f.cost && !f.there && !f.roomadj) n *= S.subj.length;
      if (f.famadj) n *= S.adj.length;
      if (f.o && S.pools[f.o]) n *= S.pools[f.o].length;
      if (f.o2 && S.pools[f.o2]) n *= Math.max(1, S.pools[f.o2].length - 1);
      if (f.t && S.pools[f.t]) n *= S.pools[f.t].length;
      if (f.polite && S.pools[f.polite]) n *= S.pools[f.polite].length;
      if (f.like && S.pools[f.like]) n *= S.pools[f.like].length;
      if (f.familylike && S.pools[f.familylike]) n *= S.pools[f.familylike].length;
      if (f.cost && S.pools[f.cost]) n *= S.pools[f.cost].length;
      if (f.adj) n *= S.adj.length;
      if (f.roomadj) n *= S.adj.length;
      if (f.fixed === 'intro') n *= S.nazionalita.length;
      if (f.there) n *= S.pools.city.length * S.pools.sight.length;
      total += n;
    });
    return total;
  }

  window.Sentences = { generate: generate, session: makeSession, variety: variety };
})();

</script>

  };
  var FILLED = { play: 1, pause: 1, stop: 1, star: 1, flame: 1, zap: 1, dot: 1, more: 1, bookmark: 1, heart: 1 };

  function ico(name, o) {
    o = o || {};
    var d = P[name] || P.dot;
    var size = o.size || 24;
    var fill = (o.fill || FILLED[name]) ? 'currentColor' : 'none';
    var stroke = fill === 'currentColor' ? 'none' : 'currentColor';
    return '<svg class="ico' + (o.cls ? ' ' + o.cls : '') + '" width="' + size + '" height="' + size +
      '" viewBox="0 0 24 24" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (o.sw || 1.75) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="' + d + '"/></svg>';
  }

  /* ---------------- haptics ---------------- */
  function haptic(ms) {
    if (document.documentElement.dataset.haptics === 'off') return;
    try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) { }
  }

  /* ---------------- ripple (pointer feedback, 80–150ms) ---------------- */
  var RIPPLE_SEL = '.btn,.nav-item,.fab,.opt,.tok,.mitem,.litem,.mini,.iconbtn,.chip-btn,.sheet-item,.tabpill';
  document.addEventListener('pointerdown', function (e) {
    if (reduced()) return;
    var t = e.target.closest ? e.target.closest(RIPPLE_SEL) : null;
    if (!t || t.disabled) return;
    var r = t.getBoundingClientRect();
    if (!r.width) return;
    var s = document.createElement('span');
    s.className = 'ripple';
    var d = Math.max(r.width, r.height) * 2.1;
    s.style.width = s.style.height = d + 'px';
    s.style.left = (e.clientX - r.left - d / 2) + 'px';
    s.style.top = (e.clientY - r.top - d / 2) + 'px';
    t.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 560);
  }, { passive: true });

  /* ---------------- 3D tilt + specular highlight ---------------- */
  var tiltRaf = 0, tiltEl = null, tiltX = 0, tiltY = 0;
  function tiltApply() {
    tiltRaf = 0;
    if (!tiltEl) return;
    tiltEl.style.setProperty('--rx', tiltX.toFixed(2) + 'deg');
    tiltEl.style.setProperty('--ry', tiltY.toFixed(2) + 'deg');
  }
  document.addEventListener('pointermove', function (e) {
    if (!fine() || reduced() || e.pointerType === 'touch') return;
    var t = e.target.closest ? e.target.closest('[data-tilt]') : null;
    if (t !== tiltEl) {
      if (tiltEl) { tiltEl.style.setProperty('--rx', '0deg'); tiltEl.style.setProperty('--ry', '0deg'); tiltEl.classList.remove('tilting'); }
      tiltEl = t;
      if (t) t.classList.add('tilting');
    }
    if (!t) return;
    var r = t.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    var max = +(t.dataset.tilt || 6);
    tiltX = (0.5 - py) * max * 2;
    tiltY = (px - 0.5) * max * 2;
    t.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
    t.style.setProperty('--my', (py * 100).toFixed(1) + '%');

  }, { passive: true });
  document.addEventListener('pointerleave', function () {
    if (tiltEl) { tiltEl.style.setProperty('--rx', '0deg'); tiltEl.style.setProperty('--ry', '0deg'); tiltEl.classList.remove('tilting'); tiltEl = null; }
  }, { passive: true });

  var pressEl = null;
  function pressTilt(e) {
    if (reduced() || e.pointerType !== 'touch') return;
    var t = e.target.closest ? e.target.closest('[data-tilt]') : null;
    if (!t) return;
    pressEl = t;
    var r = t.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    var max = +(t.dataset.tilt || 6);
    t.classList.add('pressing');
    t.style.setProperty('--rx', ((0.5 - py) * max * 1.6).toFixed(2) + 'deg');
    t.style.setProperty('--ry', ((px - 0.5) * max * 1.6).toFixed(2) + 'deg');
    t.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
    t.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  }
  function pressRelease() {
    if (!pressEl) return;
    pressEl.classList.remove('pressing');
    pressEl.style.setProperty('--rx', '0deg');
    pressEl.style.setProperty('--ry', '0deg');
    pressEl = null;

  document.addEventListener('pointerup', pressRelease, { passive: true });
  document.addEventListener('pointercancel', pressRelease, { passive: true });

  var nav, ind, ghost, items = [], fab, curKey = '', curBadge = 0, ready = false;

  function navMeasure() {
    if (!nav || !ind) return;
    var target = null;
    for (var i = 0; i < items.length; i++) if (items[i].classList.contains('on')) target = items[i];
    if (!target) { ind.style.opacity = '0'; if (ghost) ghost.style.opacity = '0'; return; }
    var nr = nav.getBoundingClientRect(), tr = target.getBoundingClientRect();
    var w = parseFloat(getComputedStyle(ind).width) || 56;
    var x = tr.left - nr.left + (tr.width - w) / 2;

    ind.style.opacity = '1';
    if (ghost) ghost.style.opacity = '1';
    ind.dataset.x = String(x);

          { transform: 'translateX(' + (prev + dx * 0.42) + 'px) scaleX(1.38)', offset: 0.42 },
          { transform: 'translateX(' + x + 'px) scaleX(0.94)', offset: 0.78 },
          { transform: 'translateX(' + x + 'px) scaleX(1)' }
        ], { duration: 430, easing: 'cubic-bezier(.22,1,.36,1)' });
      } catch (e) { }
    }
    ind.style.transform = 'translateX(' + x + 'px)';
    if (ghost) ghost.style.transform = 'translateX(' + x + 'px)';
  }

  function setActive(key) {
    curKey = key;

    curBadge = n;
    var b = document.getElementById('dueBadge');
    if (!b) return;
    b.hidden = !n;
    b.textContent = String(n);
    if (fab) fab.setAttribute('data-due', String(n));
  }

  /* ---------------- action sheet (FAB destination) ---------------- */
  var sheetEl, scrimEl, lastFocus = null, sheetOpen = false;

  function buildSheet() {
    if (document.getElementById('sheet')) {
      sheetEl = document.getElementById('sheet');
      scrimEl = document.getElementById('scrim');
      return;
    }
    scrimEl = document.createElement('div');
    scrimEl.className = 'scrim';
    scrimEl.id = 'scrim';
    scrimEl.hidden = true;
    scrimEl.addEventListener('click', closeSheet);

    sheetEl = document.createElement('div');
    sheetEl.className = 'sheet';
    sheetEl.id = 'sheet';
    sheetEl.setAttribute('role', 'dialog');
    sheetEl.setAttribute('aria-modal', 'true');
    sheetEl.setAttribute('aria-labelledby', 'sheetTitle');
    sheetEl.hidden = true;
    sheetEl.innerHTML = '<div class="sheet-grip" aria-hidden="true"></div><h2 class="sheet-title" id="sheetTitle">مرور و تمرین</h2><div class="sheet-body" id="sheetBody"></div>';
    document.body.appendChild(scrimEl);
    document.body.appendChild(sheetEl);

    /* drag-to-dismiss */
    var sy = 0, dy = 0, dragging = false;
    sheetEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      dragging = true; sy = e.clientY; dy = 0;
      sheetEl.style.transition = 'none';
      try { sheetEl.setPointerCapture(e.pointerId); } catch (x) { }
    });
    sheetEl.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - sy);
      sheetEl.style.transform = 'translateY(' + dy + 'px)';
    });
    var end = function () {
      if (!dragging) return;
      dragging = false;
      sheetEl.style.transition = '';
      sheetEl.style.transform = '';
      if (dy > 90) closeSheet();
    };
    sheetEl.addEventListener('pointerup', end);
    sheetEl.addEventListener('pointercancel', end);
  }

  function openSheet(html) {
    if (!sheetEl) buildSheet();
    document.getElementById('sheetBody').innerHTML = html;
    lastFocus = document.activeElement;
    scrimEl.hidden = false;
    sheetEl.hidden = false;
    sheetOpen = true;
    if (fab) { fab.setAttribute('aria-expanded', 'true'); fab.classList.add('open'); }
    document.body.classList.add('sheet-open');
    haptic(12);
    requestAnimationFrame(function () {
      var f = sheetEl.querySelector('button');
      if (f) f.focus();
    });
  }
  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    scrimEl.hidden = true;
    sheetEl.hidden = true;
    if (fab) { fab.setAttribute('aria-expanded', 'false'); fab.classList.remove('open'); }
    document.body.classList.remove('sheet-open');
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) { }
  }
  document.addEventListener('keydown', function (e) {
    if (!sheetOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key !== 'Tab') return;
    var f = Array.prototype.filter.call(sheetEl.querySelectorAll('button,[href],input,select,textarea'), function (x) { return !x.disabled && x.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ---------------- scroll reveal (progressive, content visible by default) ---------------- */
  var io = null;
  function reveal(root) {
    if (reduced() || !('IntersectionObserver' in window)) return;
    if (!io) {
      io = new IntersectionObserver(function (es) {
        es.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
    }
    var nodes = (root || document).querySelectorAll('[data-reveal]:not(.in)');
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.top < window.innerHeight * 0.96) nodes[i].classList.add('in');
      else io.observe(nodes[i]);
    }
  }

  /* ---------------- app bar scroll state ---------------- */
  var scrollRaf = 0;
  function onScroll() {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () {
      scrollRaf = 0;
      document.body.classList.toggle('scrolled', window.scrollY > 6);
      if (nav) nav.classList.toggle('lifted', window.scrollY > 6);
    });
  }

  /* ---------------- enhance after every render ---------------- */
  function enhance(root) {
    reveal(root);
    navMeasure();
  }

  /* ---------------- init ---------------- */
  function init() {
    if (ready) return;            /* idempotent: DOMContentLoaded must never double-build */
    nav = document.getElementById('navbar');
    ind = document.getElementById('navIndicator');
    ghost = document.getElementById('navGhost');
    fab = document.getElementById('fab');
    items = Array.prototype.slice.call(document.querySelectorAll('#navbar .nav-item'));
    buildSheet();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', function () { navMeasure(); }, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { navMeasure(); });
    if (mqReduce.addEventListener) mqReduce.addEventListener('change', function () { navMeasure(); });
    document.addEventListener('visibilitychange', function () {
      document.body.classList.toggle('paused', document.hidden);
    });
    /* re-measure once fonts settle */
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { navMeasure(); });
    ready = true;
    /* The app renders before DOMContentLoaded, so replay the last known state. */
    if (curKey) setActive(curKey); else navMeasure();
    badge(curBadge);
    setTimeout(navMeasure, 60);
    onScroll();

    /* observe app re-renders so every partial update is enhanced */
    var app = document.getElementById('app');
    if (app && 'MutationObserver' in window) {
      var pend = 0;
      new MutationObserver(function () {
        if (pend) return;
        pend = requestAnimationFrame(function () { pend = 0; enhance(app); });
      }).observe(app, { childList: true });
    }
  }

  window.UI = {
    ico: ico, haptic: haptic, reduced: reduced, fine: fine,
    setActive: setActive, badge: badge, measure: navMeasure,
    openSheet: openSheet, closeSheet: closeSheet, isSheetOpen: function () { return sheetOpen; },
    enhance: enhance, init: init
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

<script>
/* ============================================================
   Spelling / Dettatura — املای واژه‌های ایتالیایی
   ------------------------------------------------------------
   Two ways in:
     · swipe a vocabulary row to the left  -> inline practice
     · the «املا» tab                      -> a scored session
   Grading is character-aware: it reports exactly which letters
   are wrong, tolerates accents when asked, and never punishes
   capitalisation. Mastery is tracked per word, separately from
   the flashcard Leitner boxes.
   ============================================================ */
(function () {
  'use strict';

  /* ---------- text helpers ---------- */

  var ACCENTS = { 'à': 'a', 'á': 'a', 'â': 'a', 'è': 'e', 'é': 'e', 'ê': 'e',
                  'ì': 'i', 'í': 'i', 'î': 'i', 'ò': 'o', 'ó': 'o', 'ô': 'o',
                  'ù': 'u', 'ú': 'u', 'û': 'u', 'ç': 'c', '’': "'" };

  function stripAccents(s) {
    return String(s).replace(/[àáâèéêìíîòóôùúûç’]/g, function (c) { return ACCENTS[c] || c; });
  }

  /* Collapse whitespace, normalise apostrophes, trim. Keeps case for display. */
  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[’‘`]/g, "'")
      .replace(/\s+/g, ' ')
      .trim();
  }

  function fold(s) { return norm(s).toLowerCase(); }

  /* Words that are too short or are pure symbols make poor dictation items. */
  function spellable(w) {
    var t = norm(w);
    if (t.length < 3) return false;
    if (!/[a-zA-Zàáâèéêìíîòóôùúûç]/.test(t)) return false;
    if (/[.!?;:]/.test(t)) return false;      // sentences belong to the builder
    if (t.split(' ').length > 3) return false;
    return true;
  }

  /* ---------- grading ---------- */

  /* Levenshtein, capped for speed; used only for the "so close" tier. */
  function dist(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1), i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                          prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      var t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }

  /* Per-character alignment so the UI can colour the exact mistakes. */
  function diff(answer, target) {
    var a = norm(answer), b = norm(target);
    var out = [], n = Math.max(a.length, b.length);
    for (var i = 0; i < n; i++) {
      var ca = a[i] || '', cb = b[i] || '';
      out.push({
        ch: ca, want: cb,
        ok: ca.toLowerCase() === cb.toLowerCase(),
        missing: !ca && !!cb,
        extra: !!ca && !cb
      });
    }
    return out;
  }

  /**
   * grade(answer, target, {accentStrict})
   * -> { ok, near, score 0..1, reason, diff, distance }
   * reason: 'exact' | 'accent' | 'case' | 'near' | 'empty' | 'wrong'
   */
  function grade(answer, target, opt) {
    opt = opt || {};
    var a = norm(answer), b = norm(target);
    if (!a) return { ok: false, near: false, score: 0, reason: 'empty', diff: diff(a, b), distance: b.length };

    if (a === b) return { ok: true, near: false, score: 1, reason: 'exact', diff: diff(a, b), distance: 0 };

    var fa = fold(a), fb = fold(b);
    if (fa === fb) return { ok: true, near: false, score: 1, reason: 'case', diff: diff(a, b), distance: 0 };

    var sa = stripAccents(fa), sb = stripAccents(fb);
    if (sa === sb) {
      // accent-only difference: correct unless the user asked to be strict
      return { ok: !opt.accentStrict, near: !!opt.accentStrict, score: opt.accentStrict ? 0.75 : 1,
               reason: 'accent', diff: diff(a, b), distance: 0 };
    }

    var d = dist(sa, sb);
    var near = d <= Math.max(1, Math.floor(sb.length * 0.2));
    return { ok: false, near: near, score: Math.max(0, 1 - d / Math.max(1, sb.length)),
             reason: near ? 'near' : 'wrong', diff: diff(a, b), distance: d };
  }

  /* ---------- hints ---------- */

  /* level 1 -> first letter, 2 -> first third, 3 -> all but last two */
  function hint(target, level) {
    var t = norm(target);
    if (!level) return '';
    var keep = level === 1 ? 1 : level === 2 ? Math.ceil(t.length / 3) : Math.max(1, t.length - 2);
    var out = '';
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      out += (i < keep || c === ' ' || c === "'") ? c : '·';
    }
    return out;
  }

  /* Scrambled letter tiles, for the tap-to-build mode. */
  function tiles(target, rnd) {
    var t = norm(target).replace(/\s/g, '');
    var arr = t.split('');
    var r = rnd || Math.random;
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    // add two plausible distractors so it is not a pure anagram
    var pool = 'aeiourstnclm'.split('');
    if (t.length <= 9) {
      arr.push(pool[Math.floor(r() * pool.length)]);
      arr.push(pool[Math.floor(r() * pool.length)]);
      for (var k = arr.length - 1; k > 0; k--) {
        var j2 = Math.floor(r() * (k + 1));
        var t2 = arr[k]; arr[k] = arr[j2]; arr[j2] = t2;
      }
    }
    return arr;
  }

  /* ---------- word pool ---------- */

  function allWords() {
    var E = window.ESPRESSO;
    if (!E || !E.lessons) return [];
    var out = [];
    E.lessons.forEach(function (l) {
      (l.vocab || []).forEach(function (g, gi) {
        (g.items || []).forEach(function (it) {
          if (spellable(it.w)) {
            out.push({ key: 'L' + l.id + '.' + gi + ':' + it.w, w: norm(it.w),
                       fa: it.fa, l: l.id, t: it.t || '' });
          }
        });
      });
    });
    return out;
  }

  function pool(lessonId, filter) {
    var ws = allWords();
    if (lessonId) ws = ws.filter(function (x) { return x.l === +lessonId; });
    var mastery = load();
    if (filter === 'new') ws = ws.filter(function (x) { return !mastery[x.key]; });
    else if (filter === 'weak') ws = ws.filter(function (x) {
      var m = mastery[x.key]; return m && m.wrong > 0 && m.streak < 3;
    });
    else if (filter === 'hard') ws = ws.filter(function (x) { return x.w.length >= 7; });
    return ws;
  }

  /* ---------- mastery store ---------- */

  var SKEY = 'espressoA1.spelling.v1';
  var mem = null;

  function load() {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; }
    catch (e) { mem = {}; }
    return mem;
  }

  function persist() {
    try { localStorage.setItem(SKEY, JSON.stringify(mem || {})); } catch (e) {}
  }

  /* Three correct in a row = mastered. A miss resets the streak. */
  function record(key, ok, hintsUsed) {
    var m = load();
    var r = m[key] || { right: 0, wrong: 0, streak: 0, hints: 0, last: 0 };
    if (ok) {
      r.right++;
      r.streak = hintsUsed ? 0 : r.streak + 1;   // a hinted answer does not build mastery
    } else {
      r.wrong++;
      r.streak = 0;
    }
    r.hints += hintsUsed || 0;
    r.last = Date.now();
    r.mastered = r.streak >= 3;
    m[key] = r;
    persist();
    return r;
  }

  function stats(lessonId) {
    var m = load(), ws = allWords();
    if (lessonId) ws = ws.filter(function (x) { return x.l === +lessonId; });
    var tried = 0, mastered = 0, right = 0, wrong = 0;
    ws.forEach(function (x) {
      var r = m[x.key];
      if (!r) return;
      tried++;
      if (r.mastered) mastered++;
      right += r.right; wrong += r.wrong;
    });
    return { total: ws.length, tried: tried, mastered: mastered,
             right: right, wrong: wrong,
             accuracy: right + wrong ? Math.round(right / (right + wrong) * 100) : 0 };
  }

  function reset() { mem = {}; persist(); }

  /* ---------- session ---------- */

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /**
   * session({lesson, filter, count, seed})
   * -> { items, i, right, wrong, hints, started, done }
   */
  function session(opt) {
    opt = opt || {};
    var rnd = mulberry32(opt.seed || (Date.now() & 0x7fffffff));
    var ws = pool(opt.lesson, opt.filter).slice();
    // prioritise un-mastered and previously-missed words
    var m = load();
    ws.sort(function (a, b) {
      var ra = m[a.key], rb = m[b.key];
      var pa = ra ? (ra.mastered ? 2 : (ra.wrong > 0 ? 0 : 1)) : 1;
      var pb = rb ? (rb.mastered ? 2 : (rb.wrong > 0 ? 0 : 1)) : 1;
      if (pa !== pb) return pa - pb;
      return rnd() - 0.5;
    });
    var n = Math.min(opt.count || 10, ws.length);
    return { items: ws.slice(0, n), i: 0, right: 0, wrong: 0, hints: 0,
             missed: [], started: Date.now(), done: false,
             get cur() { return this.items[this.i] || null; } };
  }

  window.Spelling = {
    norm: norm, fold: fold, stripAccents: stripAccents,
    spellable: spellable, grade: grade, diff: diff, hint: hint, tiles: tiles,
    pool: pool, allWords: allWords, session: session,
    record: record, stats: stats, reset: reset,
    ACCENT_KEYS: ['à', 'è', 'é', 'ì', 'ò', 'ù']
  };
})();

</script>
<script>
/* ============================================================
   Community — گروه تلگرام
   ------------------------------------------------------------
   A real, visible invitation on entry:
     · a centred dialog appears shortly after the app opens
     · a card also sits at the top of Home until you answer
     · "later" snoozes both for a week
     · "don't show again" is permanent
     · joining marks it done for good
     · always reachable from Settings, so dismissing loses nothing

   IMPORTANT: merely *showing* the invite must NOT snooze it.
   An earlier version set `until` before re-rendering, which made
   the card erase itself the instant it appeared.
   ============================================================ */
(function () {
  'use strict';

  /* The invite belongs to the Telegram distribution. A store listing that
     greeted its buyers with "join our Telegram group" is exactly the kind of
     thing a reviewer flags, and a paid app has no business doing it at all.
     The channel is baked in at build time, so this cannot be switched on from
     the device. */
  var CHANNEL = window.ESPRESSO_CHANNEL || 'group';
  var STORE = CHANNEL === 'bazaar';

  var URL = 'https://t.me/Termefilter';
  var KEY = 'espressoA1.community.v1';
  var SNOOZE = 7 * 24 * 3600000;   // a week
  var DELAY = 1200;                // after the first screen paints

  var st = null;
  var armed = false;               // becomes true once DELAY has elapsed
  var askedThisSession = false;    // at most one dialog per app launch
  var dlg = null, scrim = null;
  var onChange = null;

  function load() {
    try { st = Object.assign({ joined: false, never: false, until: 0, shown: 0 },
                             JSON.parse(localStorage.getItem(KEY) || '{}')); }
    catch (e) { st = { joined: false, never: false, until: 0, shown: 0 }; }
    return st;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  load();

  function open() {
    // Inside the APK the native shell opens it in Telegram (or the browser).
    if (window.EspressoShell && typeof window.EspressoShell.openUrl === 'function') {
      try { if (window.EspressoShell.openUrl(URL)) return true; } catch (e) {}
    }
    try {
      var w = window.open(URL, '_blank', 'noopener');
      if (w) return true;
    } catch (e) {}
    try { window.location.href = URL; return true; } catch (e) { return false; }
  }

  /* Is the invitation still wanted at all? (independent of the current screen) */
  function eligible() {
    if (STORE) return false;                 // no invites in a store build
    return !st.joined && !st.never && Date.now() >= (st.until || 0);
  }
  function onEntryScreen() {
    var h = location.hash || '';
    return !h || h === '#/home' || h === '#/' || h === '#/lessons';
  }
  function busy() {
    return !!(window.UI && window.UI.isSheetOpen && window.UI.isSheetOpen());
  }

  var PLANE = '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">'
    + '<path d="M21.9 4.3 18.9 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-.9.5l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L7.2 13.1 2.7 11.7c-1-.3-1-1 .2-1.4l17.6-6.8c.8-.3 1.6.2 1.4 1z"/></svg>';

  function card() {
    return '<div class="tg-card">'
      + '<div class="tg-ico" aria-hidden="true">' + PLANE + '</div>'
      + '<div class="tg-txt"><b>به گروه تلگرام بپیوند</b>'
      + '<span>پرسش‌هایت را بپرس، نکته‌های تازه بگیر و با بقیهٔ زبان‌آموزها در ارتباط باش.</span></div>'
      + '<div class="tg-acts">'
      + '<button class="btn" data-act="tgjoin">عضویت در گروه</button>'
      + '<button class="btn sm ghost" data-act="tglater">بعداً</button>'
      + '<button class="btn sm ghost" data-act="tgnever">دیگر نشان نده</button>'
      + '</div></div>';
  }

  function closeDialog() {
    if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
    if (dlg && dlg.parentNode) dlg.parentNode.removeChild(dlg);
    dlg = scrim = null;
  }

  function dialogHTML() {
    return '<div class="tg-dlg-ico" aria-hidden="true">' + PLANE + '</div>'
      + '<h2 class="tg-dlg-h">به گروه تلگرام اسپرسو بپیوند</h2>'
      + '<p class="tg-dlg-p">هر روز یک نکتهٔ کوتاه ایتالیایی، رفع اشکال درس‌ها و پاسخ به پرسش‌هایت. '
      + 'عضویت رایگان است و هر وقت بخواهی می‌توانی خارج شوی.</p>'
      + '<div class="tg-dlg-acts">'
      + '<button class="btn wide" data-tg="join">عضویت در گروه</button>'
      + '<button class="btn ghost" data-tg="later">بعداً یادآوری کن</button>'
      + '<button class="btn sm ghost" data-tg="never">دیگر نشان نده</button>'
      + '</div>';
  }

  function showDialog() {
    closeDialog();
    scrim = document.createElement('div');
    scrim.className = 'tg-scrim';
    scrim.addEventListener('click', function () { Community.later(); refresh(); });

    dlg = document.createElement('div');
    dlg.className = 'tg-dlg';
    dlg.setAttribute('role', 'dialog');
    dlg.setAttribute('aria-modal', 'true');
    dlg.innerHTML = dialogHTML();
    dlg.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-tg]') : null;
      if (!b) return;
      var a = b.getAttribute('data-tg');
      if (a === 'join') Community.join();
      else if (a === 'later') Community.later();
      else Community.never();
      refresh();
    });

    document.body.appendChild(scrim);
    document.body.appendChild(dlg);
    var first = dlg.querySelector('[data-tg="join"]');
    if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
  }

  function refresh() {
    closeDialog();
    if (onChange) { try { onChange(); } catch (e) {} }
  }

  var Community = {
    url: URL,

    /* A dismissible card at the top of the home screen. */
    inviteCard: function () { return eligible() ? card() : ''; },

    /* Called on entry and whenever Home is rendered. Shows the dialog once
       per launch. Showing it does NOT snooze it — only an answer does. */
    maybeInvite: function (renderNow) {
      if (renderNow) onChange = renderNow;
      if (!armed || askedThisSession) return false;
      if (!eligible() || !onEntryScreen() || busy()) return false;
      if (dlg) return false;
      askedThisSession = true;
      st.shown++;
      save();
      showDialog();
      return true;
    },

    join: function () { st.joined = true; save(); return open(); },
    later: function () { st.until = Date.now() + SNOOZE; save(); },
    never: function () { st.never = true; save(); },
    reset: function () {
      st = { joined: false, never: false, until: 0, shown: 0 };
      save();
      askedThisSession = false;
    },
    close: closeDialog,

    /* Settings row is always available, even after "never". */
    settingsRow: function () { return { joined: st.joined, open: open }; },
    open: open,

    isStore: STORE,

    schedule: function (renderNow) {
      onChange = renderNow || null;
      if (STORE) return;                     // nothing is ever armed
      setTimeout(function () {
        armed = true;
        Community.maybeInvite(onChange);
      }, DELAY);
    },

    /* test/diagnostic helper */
    _state: function () { return Object.assign({}, st, { armed: armed, asked: askedThisSession }); }
  };

  window.Community = Community;
})();

</script>

               '<script src="https://cdn.example.com/ads.js"><\/script>'
     نکته: در جاوااسکریپت باید <\/script> بنویسی.                     */
  custom: {
    banner: '',
    native: '',
    interstitial: ''
  },

  /* ---------- تبلیغ داخلی ---------- */
  house: {

    telegram: 'https://t.me/Termefilter'

  /* ---------- رفتار ---------- */

<script>
/* ============================================================
   Ads (web) — تبلیغات در مرورگر و iOS
   ------------------------------------------------------------
   The APK ships a native Tapsell bridge (window.EspressoAds). A browser
   has no such bridge and Tapsell publishes no JavaScript publisher SDK,
   so this module implements the SAME interface the policy layer expects:

     status · setPrefs · showBanner · requestNative · nativeRect
     showInterstitial

   js/ads.js owns every rule (placement, frequency). Ads are mandatory:
   there is no opt-out and no ad-free window. This file only knows HOW
   to draw an ad:

     adsense   Google AdSense (client + slot in ads-web-config.js)
     custom    whatever snippet another network's panel gave you
     house     built-in creative: Telegram group + Android app
     auto      first configured one, else house

   If the native bridge exists this module stays dormant, so the APK can
   never show two ads for the same placement.
   ============================================================ */
(function () {
  'use strict';

  if (window.EspressoAds) {          // native Tapsell bridge wins
    window.AdsWeb = { present: false, provider: 'native' };
    return;
  }

  var CFG = window.ESP_ADWEB || {};
  var HOUSE_FALLBACK = { banner: '', native: '', interstitial: '' };

  /* ---------- provider resolution ---------- */
  var A = CFG.adsense || {}, C = CFG.custom || {};
  var hasAdsense = !!(A.client && A.slots && (A.slots.banner || A.slots.native || A.slots.interstitial));
  var hasCustom = !!(C.banner || C.native || C.interstitial);

  var provider = CFG.provider || 'auto';
  if (provider === 'auto') {
    provider = hasAdsense ? 'adsense' : (hasCustom ? 'custom' : 'house');
  }
  if (provider === 'adsense' && !hasAdsense) provider = hasCustom ? 'custom' : 'house';
  if (provider === 'custom' && !hasCustom) provider = 'house';

  var ONLINE = function () { return navigator.onLine !== false; };

  /* A remote creative needs the network; offline we degrade to our own. */
  function snippetFor(kind) {
    if (!ONLINE()) return '';
    if (provider === 'custom') return (C[kind] || '');
    return '';
  }

  /* ---------- house creative (always available, works offline) ---------- */
  var TG = (CFG.house && CFG.house.telegram) || 'https://t.me/Termefilter';

  /* The house creative exists to sell the Telegram group. That is right for the
     web/PWA and for the build handed out in the group itself, and wrong for a
     store listing: a paid or free Bazaar app must not fall back to recruiting
     for a chat channel when the ad network has nothing to serve. In a store
     build there is simply no fill, and the banner dock collapses to nothing
     (the same safe no-op the SDK path uses). */
  var STORE = (window.ESPRESSO_CHANNEL || 'group') === 'bazaar';

  function houseCreative(kind, slot) {
    if (STORE) return '';
    if (CFG.house && CFG.house.enabled === false) return '';
    if (kind === 'banner') {
      return '<a class="adw-h adw-h-banner" href="' + TG + '" rel="noopener" data-adw-link>' +
        '<span class="adw-tag">تبلیغ</span>' +
        '<span class="adw-mark" aria-hidden="true">✈</span>' +
        '<span class="adw-copy"><b>گروه تلگرام اسپرسو</b>' +
        '<i>لغت روز، تلفظ و پرسش و پاسخ</i></span>' +
        '<span class="adw-cta">عضویت</span></a>';
    }
    if (kind === 'native') {
      return '<div class="adw-h adw-h-native">' +
        '<span class="adw-tag">تبلیغ</span>' +
        '<div class="adw-hero" aria-hidden="true">☕</div>' +
        '<div class="adw-body">' +
        '<b>هر روز یک لغت ایتالیایی در تلگرام</b>' +
        '<p>تلفظ صوتی، مثال و آزمون کوتاه روزانه — رایگان.</p>' +
        '<a class="btn sm adw-btn" href="' + TG + '" rel="noopener" data-adw-link>عضویت در گروه</a>' +
        '</div></div>';
    }
    /* interstitial body */
    return '<div class="adw-big">' +
      '<div class="adw-big-art" aria-hidden="true"><span>☕</span></div>' +
      '<h3>با هم ایتالیایی یاد بگیریم</h3>' +
      '<p>در گروه تلگرام اسپرسو هر روز یک لغت، تلفظ و تمرین کوتاه می‌گذرایم — ' +
      'به‌علاوهٔ فایل‌ها و پاسخ پرسش‌ها.</p>' +
      '<a class="btn adw-btn" href="' + TG + '" rel="noopener" data-adw-link>عضویت در گروه تلگرام</a>' +
      '<div class="adw-fine">با عضویت، اپ رایگان می‌ماند.</div></div>';
  }

  /* ---------- snippet injection ---------- */
  /* innerHTML silently drops <script>, so pull each one out and re-create it. */
  function inject(html, into) {
    into.innerHTML = html;
    var scripts = into.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i], s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      s.text = old.text || '';
      old.parentNode.replaceChild(s, old);
    }
    // some networks render into a placeholder lazily
    var ins = into.querySelectorAll('ins.adsbygoogle');
    for (var k = 0; k < ins.length; k++) {
      try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
    }
  }

  function adsenseTag(kind) {
    var slot = A.slots && A.slots[kind];
    if (!slot) return '';
    return '<ins class="adsbygoogle" style="display:block;width:100%" ' +
      'data-ad-client="' + esc(A.client) + '" data-ad-slot="' + esc(slot) + '"></ins>';
  }

  var adsenseLibLoaded = false;
  function loadAdsenseLib() {
    if (adsenseLibLoaded || !hasAdsense || !ONLINE()) return;
    adsenseLibLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(A.client);
    s.crossOrigin = 'anonymous';
    document.head.appendChild(s);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ---------- element helpers ---------- */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  }

  function mount(node) { (document.body || document.documentElement).appendChild(node); }

  function openExternal(url) {
    if (window.EspressoShell && typeof window.EspressoShell.openUrl === 'function') {
      try { if (window.EspressoShell.openUrl(url)) return; } catch (e) {}
    }
    try { window.open(url, '_blank', 'noopener'); } catch (e) { location.href = url; }
  }

  /* every house CTA opens through one allow-listed path */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('[data-adw-link]') : null;
    if (!a) return;
    e.preventDefault();
    openExternal(a.getAttribute('href'));
  }, true);

  /* ---------- banner ---------- */
  var bannerEl = null, bannerOn = false;

  /* The ad's SPACE is reserved from the first frame — the floating nav is
     lifted to clear it — while its CONTENT waits for the settle window. Those
     are two different decisions and this function takes them separately:
       show === false  -> take the bar away entirely
       show === true   -> mount an empty bar at the right height, no creative
       show === 'fill' -> put the creative in
     Coupling them is what made the nav hop 74px the moment an ad arrived. */
  function showBanner(show) {
    if (!show) {
      if (bannerEl) { bannerEl.remove(); bannerEl = null; }
      if (bannerOn) { bannerOn = false; document.body.classList.remove('has-banner', 'has-adbanner'); }
      document.documentElement.style.removeProperty('--ad-h');
      return false;
    }
    var wantFill = show === 'fill';
    if (!bannerEl) {
      bannerEl = el('div', 'ad-web-banner', '');
      bannerEl.setAttribute('role', 'complementary');
      bannerEl.setAttribute('aria-label', 'تبلیغ');
      mount(bannerEl);
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(function () { measureBanner(); }).observe(bannerEl);
      }
    } else if (bannerOn) {
      /* Already on screen: keep the same node and the same creative.
         Re-rendering here is what made the bar flash whenever a screen
         changed — the ad is supposed to sit still between lessons. */
      if (wantFill && !bannerEl.dataset.filled) fillBanner();
      return true;
    }
    /* Adding these classes moves the floating nav (it clears the bar), so only
       touch body.className when the state actually changes. Rewriting the same
       class every render made the nav re-run its transition on each route. */
    if (!bannerOn) {
      bannerOn = true;
      document.body.classList.add('has-banner', 'has-adbanner');
      /* Reserve the space on this very frame. --ad-h is measured from a real
         element, and until it exists the nav sits 74px too low; mounting the
         bar a beat later then makes the nav hop. Setting the fallback height
         first means the nav never has anywhere to hop from. */
      if (!document.documentElement.style.getPropertyValue('--ad-h')) {
        document.documentElement.style.setProperty('--ad-h', '74px');
      }
    }

    /* An empty bar of the right height goes in now; the creative follows when
       it is allowed to. The bar keeps its reserved height either way, so the
       nav — which is lifted by exactly this height — does not move when the
       creative lands a moment later. */
    bannerEl.style.minHeight = '74px';
    if (wantFill) fillBanner();
    measureBanner();
    return true;
  }

  function fillBanner() {
    if (!bannerEl) return;
    if (bannerEl.dataset.filled) return;
    var custom = snippetFor('banner');
    var creative = houseCreative('banner');
    if (custom) {
      bannerEl.innerHTML = '<div class="adw-tag">تبلیغ</div><div class="adw-slot"></div>';
      inject(custom, bannerEl.querySelector('.adw-slot'));
    } else if (provider === 'adsense' && adsenseTag('banner')) {
      bannerEl.innerHTML = '<div class="adw-tag">تبلیغ</div><div class="adw-slot">' + adsenseTag('banner') + '</div>';
      loadAdsenseLib();
      inject('', bannerEl.querySelector('.adw-slot'));
    } else if (creative) {
      bannerEl.innerHTML = creative;
    } else {
      /* store builds have no house creative — leave the bar empty but sized */
      bannerEl.dataset.empty = '1';
    }
    bannerEl.dataset.filled = '1';
    measureBanner();
  }

  /* The nav pill floats above the banner, so the lift must equal the bar's REAL
     height — a creative that is taller than the CSS default would otherwise end
     up under the nav. Measured, never assumed. */
  var measureRaf = 0;
  function measureBanner() {
    if (!bannerEl) return;
    if (measureRaf) cancelAnimationFrame(measureRaf);
    measureRaf = requestAnimationFrame(function () {
      measureRaf = 0;
      if (!bannerEl) return;
      var h = Math.round(bannerEl.getBoundingClientRect().height);
      if (h > 0) document.documentElement.style.setProperty('--ad-h', h + 'px');
    });
  }

  /* ---------- native slots ---------- */
  var filled = {};

  function requestNative(slot) {
    delete filled[slot];
    return true;          // nothing to pre-fetch: we render inline
  }

  function renderNative(slot, box) {
    if (!box || filled[slot]) return;
    filled[slot] = true;
    var custom = snippetFor('native');
    if (custom) {
      box.innerHTML = '<div class="adw-tag">تبلیغ</div><div class="adw-slot"></div>';
      inject(custom, box.querySelector('.adw-slot'));
      return;
    }
    if (provider === 'adsense' && adsenseTag('native')) {
      box.innerHTML = '<div class="adw-tag">تبلیغ</div><div class="adw-slot">' + adsenseTag('native') + '</div>';
      loadAdsenseLib();
      inject('', box.querySelector('.adw-slot'));
      return;
    }
    box.innerHTML = houseCreative('native');
  }

  /* ads.js already drives this on every animation frame; the browser has no
     overlay view to position, so we use the same call to fill the slot the
     first time it becomes visible. */
  function nativeRect(slot, left, top, w, h, vis) {
    if (!vis) return;
    renderNative(slot, document.querySelector('[data-ad-slot="' + slot + '"]'));
  }

  /* ---------- overlay (interstitial) ---------- */
  var overlay = null;

  function closeOverlay() {
    if (!overlay) return;
    overlay.remove();
    overlay = null;
    document.body.style.removeProperty('overflow');
  }

  function buildOverlay(html, opts) {
    closeOverlay();
    overlay = el('div', 'adw-scrim', '');
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'تبلیغ');

    var card = el('div', 'adw-card' + (opts.wide ? ' wide' : ''),
      '<div class="adw-top"><span class="adw-tag">تبلیغ</span>' +
      '<button class="adw-x" type="button" aria-label="بستن تبلیغ" disabled>✕</button></div>' +
      '<div class="adw-body-slot"></div>');
    overlay.appendChild(card);
    mount(overlay);
    document.body.style.overflow = 'hidden';

    var body = card.querySelector('.adw-body-slot');
    body.innerHTML = html;

    var x = card.querySelector('.adw-x');
    x.addEventListener('click', function () {
      if (x.disabled) return;
      closeOverlay();
      if (opts.onClose) opts.onClose();
    });
    return { card: card, body: body, close: x };
  }

  function countdown(btn, seconds, label, done) {
    var left = seconds;
    btn.disabled = true;
    btn.textContent = label.replace('{n}', fa(left));
    var t = setInterval(function () {
      left--;
      if (left > 0) { btn.textContent = label.replace('{n}', fa(left)); return; }
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = done;
      if (done === '✕') btn.setAttribute('aria-label', 'بستن تبلیغ');
    }, 1000);
    return t;
  }

  function fa(n) {
    return String(n).replace(/\d/g, function (d) { return String.fromCharCode(0x06F0 + (+d)); });
  }


  function showInterstitial(reason) {
    var delay = Math.max(0, (CFG.interstitialDelay == null ? 5 : CFG.interstitialDelay));
    var custom = snippetFor('interstitial');
    var html = custom ? '<div class="adw-slot"></div>'
                      : (provider === 'adsense' && adsenseTag('interstitial') ? adsenseTag('interstitial')
                                                                             : houseCreative('interstitial'));
    var ui = buildOverlay(html, {
      wide: true,
      onClose: function () {
        /* same contract the native bridge emits, so js/ads.js can clear
           a pending navigation whichever backend closed the overlay */
        if (window.__adsEvent) window.__adsEvent('closed', {});
        if (window.__adsClosed) window.__adsClosed();
      }
    });
    if (custom) { inject(custom, ui.body.querySelector('.adw-slot')); }
    if (provider === 'adsense' && !custom) { loadAdsenseLib(); inject('', ui.body); }

    countdown(ui.close, delay, 'بستن تا {n}', '✕');
    return true;
  }

  /* ---------- bridge surface used by js/ads.js ---------- */
  window.AdsWeb = {
    present: true,
    provider: provider,

    status: function () {
      return JSON.stringify({
        ready: true,
        provider: provider,
        hasKey: provider === 'house' ? true : (provider === 'adsense' ? hasAdsense : hasCustom),
        sdk: true,
        web: true,
        online: ONLINE()
      });
    },

    /* Kept for the native contract; placements themselves cannot be disabled. */
    setPrefs: function () { return true; },

    showBanner: showBanner,

    /* A banner that is already on screen must survive a re-render. */
    requestNative: requestNative,
    nativeRect: nativeRect,

    showInterstitial: showInterstitial,

    /* Settings helpers */
    hasCustomCode: hasCustom || hasAdsense,
    houseEnabled: !(CFG.house && CFG.house.enabled === false)
  };

  /* A PWA can be closed for days; the service worker keeps the shell, and this
     asks the browser not to evict the progress we store. */
  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist().catch(function () {}); } catch (e) {}
  }
})();

</script>
<script>
/* ============================================================
   Ads — تبلیغات (اجباری)
   ------------------------------------------------------------
   Provider: Tapsell (Iran). The classic SDK is bundled into the APK
   by tools/android/build-apk.py; Gradle builds may use mediation
   instead. Either way the native side exposes one small bridge
   (window.EspressoAds) and this module owns ALL policy:
   placement and frequency. When the bridge is absent every call is
   a no-op, so a browser build still works.

   Policy — ads are mandatory, there is NO opt-out, and every format
   sits BETWEEN lessons rather than on entering/leaving a section:
     · banner        one persistent bar, drawn once and never re-created
                     when you move between screens (no enter/exit flash)
     · native        BETWEEN lesson rows (every 2nd lesson, and after each
                     Facciamo-il-punto block), between vocab groups
                     (every 8th word), search results and verb tables
     · interstitial  only when you actually move from one lesson to
                     another (the «درس بعد» button or a lesson→lesson
                     jump). Never when a lesson opens, a tab changes or
                     an exercise finishes.

   The one thing kept: an in-list native card never lands inside a
   running exercise's answer list. No user setting, reward or timer can
   turn ads off — that switch was removed on purpose.
   ============================================================ */
(function () {
  'use strict';

  /* Two backends, one policy: the APK's native Tapsell bridge, or the
     browser engine in js/ads-web.js (iOS/PWA has no native bridge). */
  var B = window.EspressoAds || (window.AdsWeb && window.AdsWeb.present ? window.AdsWeb : null);
  var KEY = 'espressoA1.ads.v2';
  var st = { ready: false, provider: 'tapsell', hasKey: false, sdk: false };
  var state = null;
  var sessionCount = 0, lastInter = 0, lastLessonAd = 0;
  var pendingNav = null;      // fired when the between-lesson ad closes
  var bootAt = Date.now();

  var DEF_STATE = { interTotal: 0 };

  var MIN_GAP = 45000;        // generic breaks (Settings "show me an ad")
  var MIN_GAP_LESSON = 20000;  // lesson -> lesson hops: the ad spot that counts
  var MAX_PER_SESSION = 12;
  /* Nothing competes with the first paint for this long. Overridable only for
     automated tests (tools/ads-web-test.js) — never set by the app. */
  var SETTLE = window.ESP_ADS_SETTLE == null ? 2500 : +window.ESP_ADS_SETTLE;

  function read(k, def) {
    try { return Object.assign({}, def, JSON.parse(localStorage.getItem(k) || '{}')); }
    catch (e) { return Object.assign({}, def); }
  }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function load() { state = read(KEY, DEF_STATE); }
  load();

  function refresh() {
    if (!B) return st;
    try { st = JSON.parse(B.status()) || st; } catch (e) {}
    return st;
  }

  /* Re-offer the placements on the current screen. Called when the SDK
     finishes initialising, which happens after the first render. */
  function reapply() {
    if (!B) return;
    banner(true);
    if (typeof window.__adsSync === 'function') {
      try { window.__adsSync(); } catch (e) {}
    }
  }

  /* Native callbacks land here. */
  window.__adsEvent = function (kind, payload) {
    if (kind === 'ready') {
      refresh();
      reapply();
      return;
    }
    if (kind === 'closed') {
      var nav = pendingNav;
      pendingNav = null;
      if (nav) { try { nav(); } catch (e) {} }
      if (typeof window.__adsClosed === 'function') window.__adsClosed();
    } else if (kind === 'native') {
      var el = document.querySelector('[data-ad-slot="' + (payload && payload.slot) + '"]');
      if (el && payload && payload.html) el.innerHTML = payload.html;
    }
  };

  /* Screens whose body is a running exercise: an in-list native card would
     land between answer rows, so it waits for the next list screen. */
  function inExercise() {
    var h = location.hash || '';
    if (/\/(quiz|cards|build|spell)(\/|$)/.test(h)) return true;
    if (/^#\/(fc|test|quick)/.test(h)) return true;
    return false;
  }

  function allowed() {
    if (!B || !st.ready || !st.hasKey) return false;
    if (Date.now() - bootAt < SETTLE) return false;   // let the first paint land
    return true;
  }

  var Ads = {
    present: !!B,
    mandatory: true,

    init: function () {
      if (!B) return false;
      refresh();
      /* Consent for personalised creatives; no placement can be turned off. */
      try { B.setPrefs(JSON.stringify({ personalised: true })); } catch (e) {}
      var tries = 0, wasReady = false;
      var t = setInterval(function () {
        refresh();
        if (st.ready && !wasReady) { wasReady = true; reapply(); }
        // keep nudging for the first minute: fill can arrive late
        if (++tries > 200) clearInterval(t);
        else if (st.ready && tries % 16 === 0) reapply();
      }, 300);
      return true;
    },

    status: function () { return st; },

    /* Plain-language explanation of why an ad slot may be empty right now.
       Surfaced in Settings so a fill problem is never a mystery. */
    diag: function () {
      refresh();
      var why = null;
      if (!B) why = 'noBridge';
      else if (!st.hasKey) why = 'noKey';
      else if (!st.sdk) why = 'noSdk';
      else if (!st.ready) why = 'notReady';
      else if (Date.now() - bootAt < SETTLE) why = 'settle';
      return {
        bridge: !!B, sdk: !!st.sdk, ready: !!st.ready, hasKey: !!st.hasKey,
        provider: st.provider || 'tapsell', why: why,
        shown: state.interTotal
      };
    },

    /* Settings "try an ad now" — bypasses frequency policy on purpose,
       but still needs a real SDK and a filled cache. */
    test: function () {
      if (!B) return 'noBridge';
      refresh();
      if (!st.sdk) return 'noSdk';
      try { return B.showInterstitial('manual-test') ? 'requested' : 'noSdk'; }
      catch (e) { return 'error'; }
    },
    testBanner: function () {
      if (!B) return 'noBridge';
      try { return B.showBanner(true) ? 'requested' : 'noSdk'; } catch (e) { return 'error'; }
    },

    /* Bottom banner. The native side owns the view; we only say when.
       Every screen gets it — there is nothing to switch off. */
    banner: function () { return banner(true); },

    /* A native slot inside a list. The real ad is a native view positioned over
       this box, so the box reserves height and reports its rect as we scroll.
       Without the SDK the box collapses and nothing is reserved. */
    nativeSlot: function (slot) {
      if (!allowed() || inExercise()) return '';
      try { if (!B.requestNative(slot)) return ''; } catch (e) { return ''; }
      return '<div class="ad-native" data-ad-slot="' + slot + '" aria-label="تبلیغ"></div>';
    },

    /* Report every visible slot rect to the native layer. Throttled to one
       animation frame so scrolling stays smooth. */
    syncSlots: function () {
      if (!B || typeof B.nativeRect !== 'function') return;
      var els = document.querySelectorAll('[data-ad-slot]');
      if (!els.length) return;
      var wh = window.innerHeight || 0;
      for (var i = 0; i < els.length; i++) {
        var el = els[i], r = el.getBoundingClientRect();
        // only the part actually on screen; the native view is clipped to it
        var top = Math.max(0, r.top), bottom = Math.min(wh, r.bottom);
        var h = bottom - top;
        var vis = h > 24 && r.width > 40;
        try {
          B.nativeRect(el.getAttribute('data-ad-slot'),
                       vis ? r.left : 0, vis ? top : 0,
                       vis ? r.width : 0, vis ? h : 0, vis);
        } catch (e) {}
      }
    },

    /* The lesson boundary. Call it when the user moves from lesson N to
       lesson M (the «درس بعد» button, a lesson→lesson jump from the list).
       It shows the interstitial and THEN navigates, so the ad sits between
       the two lessons and never blocks a section from opening. If the ad
       cannot be shown, the callback still runs immediately. */
    betweenLessons: function (next) {
      var done = false;
      function finish() { if (done) return; done = true; pendingNav = null; if (next) { try { next(); } catch (e) {} } }
      if (!allowed()) { finish(); return false; }
      var now = Date.now();
      if (now - lastLessonAd < MIN_GAP_LESSON) { finish(); return false; }
      if (sessionCount >= MAX_PER_SESSION) { finish(); return false; }
      var ok = false;
      try { ok = !!B.showInterstitial('between-lessons'); } catch (e) { ok = false; }
      if (!ok) { finish(); return false; }
      lastLessonAd = now; lastInter = now; sessionCount++;
      state.interTotal++; write(KEY, state);
      pendingNav = finish;
      setTimeout(finish, 25000);        // never trap the navigation
      return true;
    },

    /* Call at a generic natural break (Settings diagnostics/tests only). */
    interstitial: function (reason) {
      if (!allowed()) return false;
      var now = Date.now();
      if (now - lastInter < MIN_GAP) return false;
      if (sessionCount >= MAX_PER_SESSION) return false;
      lastInter = now; sessionCount++;
      state.interTotal++; write(KEY, state);
      try { return !!B.showInterstitial(reason || 'break'); } catch (e) { return false; }
    },

    resetSession: function () { sessionCount = 0; },
    stats: function () { return { interTotal: state.interTotal }; }
  };

  function banner() {
    if (!B) return false;
    /* The banner's SPACE is reserved from the first frame — the dock lifts the
       nav to clear it — but its CONTENT is not fetched until the settle window
       passes, so the ad never competes with the first paint. Splitting the two
       is what stops the nav hopping when the ad finally arrives. */
    var settled = Date.now() - bootAt >= SETTLE;
    if (!B) return false;
    try {
      if (!settled) return !!B.showBanner(true);        // reserve the slot, no ad yet
      if (!allowed()) return !!B.showBanner(true);      // no fill available; keep the slot
      return !!B.showBanner('fill');                    // put the creative in
    } catch (e) { return false; }
  }

  window.Ads = Ads;
})();

</script>
<script>
/* ============================================================
   Bazaar — کافه‌بازار
   ------------------------------------------------------------
   Store integration for the Iranian market: rate/comment deep
   link, update check and the developer page. All of it goes
   through the native bridge (window.EspressoBazaar); in a browser
   the module reports present=false and the UI hides itself.
   ============================================================ */
(function () {
  'use strict';

  var B = window.EspressoBazaar || null;
  var PKG = 'com.kasra.espressoa1';

  function call(name, arg) {
    if (!B || typeof B[name] !== 'function') return false;
    try { return !!B[name](arg); } catch (e) { return false; }
  }

  window.Bazaar = {
    present: !!B,
    package: PKG,

    /* Opens the app's Bazaar page on the comment tab. */
    rate: function () {
      if (call('rate')) return true;
      try { window.location.href = 'bazaar://details?id=' + PKG; } catch (e) {}
      return false;
    },

    /* Opens a Bazaar listing. Without an argument it is this app's own page;
       the paid edition passes its package id so the free build can send a
       buyer straight to the thing they are buying. */
    details: function (pkg) {
      if (pkg && B && typeof B.detailsFor === 'function') {
        try { if (B.detailsFor(pkg)) return true; } catch (e) {}
      }
      if (!pkg) return call('details');
      return false;
    },

    /* Store page of another listing, for the web build. */
    storeUrl: function (pkg) { return 'https://cafebazaar.ir/app/' + (pkg || PKG); },

    /* Asks Bazaar whether a newer release exists; shows its own update UI. */
    checkUpdate: function () { return call('checkUpdate'); },

    developer: function () { return call('developer'); },

    /* Whether the app was installed from Bazaar (affects update prompts). */
    installedFromStore: function () {
      if (!B || typeof B.installer !== 'function') return false;
      try {
        var i = B.installer();
        return i === 'com.farsitel.bazaar';
      } catch (e) { return false; }
    }
  };
})();

</script>
<script>
/* ============================================================
   Edition — نسخه‌های برنامه
   ------------------------------------------------------------
   One codebase, three ways to ship it. The build injects
   window.ESPRESSO_EDITION before this file loads:

     'full'   the Telegram-group build: every level open, no paywall
     'a1'     the free Bazaar listing: A1 open, the rest behind a purchase
     'pro'    the paid Bazaar listing: everything open, same as 'full'

   Nothing here phones home and nothing here can be talked out of
   its decision by a stored value — the gate is decided at build
   time and lives in code, not in localStorage. A user who wants
   the paid levels buys the paid listing; the free listing simply
   has no code path that opens them.
   ============================================================ */
(function () {
  'use strict';

  var id = window.ESPRESSO_EDITION || 'full';
  var FREE = ['A1'];                    // what the free listing may open

  /* The paid listing. Kept here (not in the native bridge) so the web,
     iOS and APK builds all point at the same place. */
  var PRO_PKG = 'com.kasra.espresso.full';
  var PRO_WEB = 'https://cafebazaar.ir/app/' + PRO_PKG;

  /* Launch price for the complete course.
     Worked out in toman, not in a foreign currency converted once and left to
     rot: the free-market dollar went from ~108,000 to ~267,000 toman between
     the first draft of this file and release, which silently turned an earlier
     149,000 figure into about fifty cents. Anchor on what the buyer earns.
        printed course book, one level ......... ~7,000,000 toman
        this app, both levels, one-time ......... 399,000  (~5% of one book)
        comparable premium Iranian study apps ... 200,000-500,000
     One-time, no subscription, future B1-C2 included. Whatever is set here
     MUST match the price in the Bazaar dashboard — Bazaar charges its own
     number, this file only tells the buyer what that number is. */
  var PRICE = { amount: 399000, currency: 'تومان', intro: 249000 };

  function money(n) {
    /* 399000 -> ۳۹۹٬۰۰۰ */
    var fa = '۰۱۲۳۴۵۶۷۸۹';

    /* May this level be opened at all? Only the free ones in a limited build. */

      return FREE.indexOf(levelId) >= 0;
    },

    },

    benefits: [
      'سطح A2 کامل: ۱۰ درس، واژگان، مکالمه، گرامر و آزمون',
      'سطح‌های B1 و B2 و C1 و C2 به‌محض آماده شدن، در همان خرید',

      'همهٔ به‌روزرسانی‌های بعدی رایگان'
